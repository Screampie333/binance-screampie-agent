name: Binance Agent 24/7 Worker

on:
  workflow_dispatch:

jobs:
  generate-linux-session:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Install baw CLI, qrencode & gnome-keyring
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode gnome-keyring dbus-x11
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g @binance/agentic-wallet@1.12.0

      - name: Capture Real Browser URL & Send QR Image to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Start headless DBus & unlocked GNOME Keyring
          eval $(dbus-launch --sh-syntax)
          mkdir -p "$HOME/.local/share/keyrings"
          printf "bawpass" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1 || true
          eval $(printf "bawpass" | gnome-keyring-daemon --start --components=secrets 2>/dev/null) || true

          cat <<'EOF' > /tmp/hook.js
          const fs = require('fs');
          const cp = require('child_process');
          const origSpawn = cp.spawn;
          cp.spawn = function(cmd, args, opts) {
            const all = [cmd, ...(args || [])].join(' ');
            const match = all.match(/https?:\/\/[^\s'"]+/);
            if (match) fs.writeFileSync('/tmp/captured_url.txt', match[0]);
            return origSpawn.apply(this, arguments);
          };
          EOF

          NODE_OPTIONS="--require /tmp/hook.js" script -q -f -c "baw auth signin" /tmp/signin.log > /dev/null 2>&1 &
          SIGNIN_PID=$!

          for i in $(seq 1 25); do
            if [ -s /tmp/captured_url.txt ]; then
              sleep 1
              break
            fi
            sleep 1
          done

          REAL_URL=$(cat /tmp/captured_url.txt 2>/dev/null | tr -d '[:space:]')
          CLEAN_LOG=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/signin.log | tr -cd '\11\12\15\40-\176')
          PAIR_CODE=$(echo "$CLEAN_LOG" | grep -oE 'Pairing code:[[:space:]]*[a-zA-Z0-9]+' | awk -F': ' '{print $2}' | tr -d '[:space:]')

          qrencode -s 10 -o /tmp/qr.png "$REAL_URL"
          CAPTION_TXT=$(printf "🔑 SCAN QR INI DARI APLIKASI BINANCE (Pairing Code: %s)\nURL: %s" "$PAIR_CODE" "$REAL_URL")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F photo=@/tmp/qr.png \
            -F caption="${CAPTION_TXT}"

          wait $SIGNIN_PID || baw auth verify || true
          sleep 2

          baw wallet status --json
          tar -czf /tmp/baw_linux.tar.gz -C "$HOME" .baw .local/share/keyrings
          B64_STR=$(base64 -w 0 /tmp/baw_linux.tar.gz)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ COPY STRING BASE64 BARU DI BAWAH INI KE SECRET BAW_SESSION_B64:"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${B64_STR}"
