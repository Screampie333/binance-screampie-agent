name: Binance Agent 24/7 Worker

on:
  schedule:
    # Jalan otomatis setiap 15 menit (24/7)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install baw CLI & OpenClaw
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g @binance/agentic-wallet@1.12.0 openclaw@latest
          baw --version
          openclaw --version

      - name: Restore Binance Wallet Session
        env:
          BAW_SESSION_B64: ${{ secrets.BAW_SESSION_B64 }}
        run: |
          echo "$BAW_SESSION_B64" | base64 -d > /tmp/baw.tar.gz
          tar -xzf /tmp/baw.tar.gz -C "$HOME"
          rm -f /tmp/baw.tar.gz
          chmod 700 "$HOME/.baw"
          baw wallet status --json

      - name: Setup OpenClaw & Binance Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p "$HOME/.openclaw/workspace"

          # Inisialisasi dasar OpenClaw
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice groq-api-key \
            --groq-api-key "$GROQ_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          # Daftarkan model Gemini aktif dari akun kamu (ringan, cepat, bebas limit)
          openclaw config set agents.defaults.models '{"google/gemini-3.1-flash-lite":{},"google/gemini-3.5-flash-lite":{},"google/gemini-3.7-flash":{},"google/gemini-3.8-flash":{}}' --strict-json --merge || true
          openclaw models set google/gemini-3.1-flash-lite || true
          openclaw models fallbacks add google/gemini-3.5-flash-lite || true
          openclaw models fallbacks add google/gemini-3.7-flash || true
          openclaw models fallbacks add google/gemini-3.8-flash || true

          cp AGENTS.md "$HOME/.openclaw/workspace/AGENTS.md"
          cat <<EOF > "$HOME/.openclaw/.env"
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          EOF
          chmod 600 "$HOME/.openclaw/.env"

          # Install 3 skill inti & ganti symlink jadi folder fisik
          cd "$HOME/.openclaw/workspace"
          npx -y skills add binance/binance-skills-hub/skills/binance-web3 --all --agent '*' -y
          rm -rf "$HOME/.openclaw/workspace/skills"
          mkdir -p "$HOME/.openclaw/workspace/skills"
          for s in binance-agentic-wallet query-token-audit query-token-info; do
            cp -r "$HOME/.openclaw/workspace/.agents/skills/$s" "$HOME/.openclaw/workspace/skills/"
          done
          rm -rf "$HOME/.openclaw/workspace/.agents"

          openclaw models status

      - name: Execute Agent Cycle & Notify Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd "$HOME/.openclaw/workspace"
          RESULT=$(openclaw agent --local --message "Periksa status wallet & sisa gas menggunakan baw CLI, lalu cek peluang terbaru untuk Free Mint (NFT & Token), Klaim khusus pemegang Agent ID, dan Kampanye Tugas Agent. Ikuti aturan ketat di AGENTS.md. Buat ringkasan singkat hasil pengecekanmu.")
          echo "$RESULT"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${RESULT}"
