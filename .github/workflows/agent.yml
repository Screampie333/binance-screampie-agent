name: Binance Agent 24/7 Worker

on:
  workflow_dispatch:

jobs:
  generate-linux-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install baw CLI
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g @binance/agentic-wallet@1.12.0

      - name: Start Linux Login & Send QR to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          script -q -f -c "baw auth signin" /tmp/signin.log > /dev/null 2>&1 &
          SIGNIN_PID=$!

          for i in $(seq 1 25); do
            if grep -q "http" /tmp/signin.log 2>/dev/null; then
              sleep 2
              break
            fi
            sleep 1
          done

          CLEAN_LOG=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/signin.log | tr -cd '\11\12\15\40-\176' | head -c 3500)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔑 SEGERA SCAN LINK DI BAWAH INI:
${CLEAN_LOG}"

          wait $SIGNIN_PID || baw auth verify || true

          baw wallet status --json
          tar -czf /tmp/baw_linux.tar.gz -C "$HOME" .baw
          B64_STR=$(base64 -w 0 /tmp/baw_linux.tar.gz)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ COPY STRING BASE64 DI BAWAH INI KE SECRET BAW_SESSION_B64:"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${B64_STR}"
