name: Binance Agent 24/7 Worker

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-command]

concurrency:
  group: makefun-agent-worker
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git & GitHub Auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Screampie333"
          git config --global user.email "screampie333@users.noreply.github.com"
          git config --global init.defaultBranch main
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install OpenClaw, make.fun Skill & Web3 Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g openclaw@latest

          mkdir -p "$HOME/.openclaw/workspace"
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice gemini-api-key \
            --gemini-api-key "$GEMINI_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          openclaw config set tools.profile full || true
          openclaw config set agents.defaults.models '{"google/gemini-2.5-flash":{},"google/gemini-3.1-flash-lite":{},"groq/llama-3.3-70b-versatile":{}}' --strict-json --merge || true
          openclaw models set google/gemini-2.5-flash || true
          openclaw models fallbacks add google/gemini-3.1-flash-lite || true
          openclaw models fallbacks add groq/llama-3.3-70b-versatile || true

          cp AGENTS.md "$HOME/.openclaw/workspace/AGENTS.md"
          printf "GEMINI_API_KEY=%s\nGOOGLE_API_KEY=%s\nGROQ_API_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nMAKEFUN_API_KEY=%s\n" \
            "$GEMINI_API_KEY" "$GEMINI_API_KEY" "$GROQ_API_KEY" "$TELEGRAM_BOT_TOKEN" "$MAKEFUN_API_KEY" > "$HOME/.openclaw/.env"
          chmod 600 "$HOME/.openclaw/.env"

          cd "$HOME/.openclaw/workspace"
          npx -y skills add binance/binance-skills-hub/skills/binance-web3 --all --agent '*' -y
          rm -rf "$HOME/.openclaw/workspace/skills"
          mkdir -p "$HOME/.openclaw/workspace/skills/makefun"
          for s in query-token-audit query-token-info; do
            cp -r "$HOME/.openclaw/workspace/.agents/skills/$s" "$HOME/.openclaw/workspace/skills/"
          done
          rm -rf "$HOME/.openclaw/workspace/.agents"

          curl -fsSL "https://make.fun/skill.md" -o "$HOME/.openclaw/workspace/skills/makefun/SKILL.md"
          curl -fsSL "https://make.fun/heartbeat.md" -o "$HOME/.openclaw/workspace/skills/makefun/heartbeat.md" || true

      - name: Cleanup Closed & Unsubmitted makefun-* Repos
        env:
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/cleanup_repos.mjs
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const envFile = process.env.GITHUB_ENV;
          function setEnv(name, value) {
            const delim = `EOF_${name}_${Date.now()}`;
            fs.appendFileSync(envFile, `${name}<<${delim}\n${value}\n${delim}\n`);
          }

          const headers = { Accept: "application/json" };
          if (process.env.MAKEFUN_API_KEY) headers["x-api-key"] = process.env.MAKEFUN_API_KEY;

          let repos = [];
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync(
                "gh",
                ["repo", "list", "Screampie333", "--limit", "100", "--json", "name,createdAt"],
                { encoding: "utf8", timeout: 30000 }
              );
              repos = JSON.parse(out || "[]");
            }
          } catch {}

          let myGlobalSubs = [];
          try {
            const meRes = await fetch("https://make.fun/api/me/submissions?limit=200", { headers });
            if (meRes.ok) {
              const meJson = await meRes.json();
              myGlobalSubs = Array.isArray(meJson) ? meJson : (meJson.submissions || meJson.items || meJson.data || []);
            }
          } catch {}

          const deletedList = [];
          let permWarning = "";

          for (const repo of repos) {
            if (!repo.name.toLowerCase().startsWith("makefun-")) continue;

            if (repo.createdAt) {
              const ageMs = Date.now() - new Date(repo.createdAt).getTime();
              if (!Number.isNaN(ageMs) && ageMs < 30 * 60 * 1000) continue;
            }

            const slug = repo.name.slice("makefun-".length);
            let isClosed = false;

            try {
              const compRes = await fetch(`https://make.fun/api/competitions/${slug}`, { headers });
              if (compRes.status === 404) {
                isClosed = true;
              } else if (compRes.ok) {
                const compJson = await compRes.json();
                const compObj = compJson.competition || compJson.data || compJson;
                const accepting = compObj.acceptingSubmissions ?? compObj.accepting_submissions;
                const status = String(compObj.status || "").toLowerCase();
                const closeRaw = compObj.closesAt || compObj.closes_at || compObj.submissionsCloseAt || compObj.deadline || compObj.endAt;
                const closeMs = closeRaw ? new Date(closeRaw).getTime() : NaN;

                if (accepting === false && (/closed|resolved|settled|ended|cancelled/i.test(status) || (!Number.isNaN(closeMs) && closeMs < Date.now()))) {
                  isClosed = true;
                }
              }
            } catch {}

            if (!isClosed) continue;

            let compSubs = [];
            try {
              const subsRes = await fetch(`https://make.fun/api/competitions/${slug}/submissions`, { headers });
              if (subsRes.ok) {
                const subsJson = await subsRes.json();
                compSubs = Array.isArray(subsJson) ? subsJson : (subsJson.submissions || subsJson.items || subsJson.data || []);
              }
            } catch {}

            const hasSubmission = [...myGlobalSubs, ...compSubs].some(s => {
              const sSlug = String(s.competition || s.competition_slug || s.slug || "").toLowerCase();
              const sRepo = String(s.repo || s.repo_url || "").toLowerCase();
              return sSlug === slug.toLowerCase() || sRepo.includes(repo.name.toLowerCase());
            });

            if (hasSubmission) continue;

            try {
              execFileSync("gh", ["repo", "delete", `Screampie333/${repo.name}`, "--yes"], {
                encoding: "utf8",
                timeout: 30000
              });
              deletedList.push(repo.name);
            } catch (err) {
              const msg = `${err.stderr || err.message || ""}`;
              if (/delete_repo|403|scope/i.test(msg)) {
                permWarning = "⚠️ GH_PAT belum memiliki izin 'delete_repo', pembersihan repo dilewati.";
                break;
              }
            }
          }

          setEnv("CLEANED_REPOS", deletedList.join(", "));
          setEnv("CLEANUP_WARNING", permWarning);
          EOF
          node /tmp/cleanup_repos.mjs

      - name: Select Unsubmitted / Failed Repo or New Active Free Bounty
        env:
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/select_bounty.mjs
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const envFile = process.env.GITHUB_ENV;
          function setEnv(name, value) {
            const delim = `EOF_${name}_${Date.now()}`;
            fs.appendFileSync(envFile, `${name}<<${delim}\n${value}\n${delim}\n`);
          }

          async function getGas(name, rpcUrl) {
            try {
              const res = await fetch(rpcUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_gasPrice", params: [] })
              });
              const json = await res.json();
              const wei = BigInt(json.result || "0x0");
              const gwei = (Number(wei) / 1e9).toFixed(3);
              return `${name}: ${gwei} Gwei`;
            } catch {
              return `${name}: unavailable`;
            }
          }

          const gasList = await Promise.all([
            getGas("BSC (Chain 56)", "https://bsc-dataseed.binance.org"),
            getGas("Base (Chain 8453)", "https://mainnet.base.org"),
            getGas("Ethereum (Chain 1)", "https://eth.llamarpc.com")
          ]);
          setEnv("GAS_REPORT", gasList.join(" | "));

          let existingRepos = [];
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync("gh", ["repo", "list", "Screampie333", "--limit", "100", "--json", "name,url"], { encoding: "utf8", timeout: 30000 });
              existingRepos = JSON.parse(out || "[]");
            }
          } catch {}
          const existingNames = existingRepos.map(r => r.name.toLowerCase());

          const headers = { Accept: "application/json" };
          if (process.env.MAKEFUN_API_KEY) headers["x-api-key"] = process.env.MAKEFUN_API_KEY;
          const hasWalletKey = Boolean((process.env.SOLANA_PRIVATE_KEY || "").trim());

          function isStillAccepting(compObj) {
            const accepting = compObj.acceptingSubmissions ?? compObj.accepting_submissions;
            if (accepting !== true) return false;
            const closeRaw = compObj.closesAt || compObj.closes_at || compObj.submissionsCloseAt || compObj.deadline || compObj.endAt;
            if (closeRaw) {
              const closeMs = new Date(closeRaw).getTime();
              if (!Number.isNaN(closeMs) && closeMs <= Date.now() + 5 * 60 * 1000) return false;
            }
            return true;
          }

          function requiresWalletSignature(compObj, reqObj) {
            if (compObj?.escrowed === true || compObj?.requiresSignature === true || compObj?.requires_signature === true) return true;
            if (reqObj?.how_to_submit?.entry_message_template || reqObj?.entry_message_template) return true;
            return false;
          }

          let myGlobalSubs = [];
          try {
            const meRes = await fetch("https://make.fun/api/me/submissions?limit=100", { headers });
            if (meRes.ok) {
              const meJson = await meRes.json();
              myGlobalSubs = Array.isArray(meJson) ? meJson : (meJson.submissions || meJson.items || meJson.data || []);
            }
          } catch {}

          let mode = "new";
          let targetSlug = "";
          let targetTitle = "";
          let failedDetail = "";

          // 1. Cek repo GitHub makefun-* yang masih open:
          //    (a) belum pernah masuk ke make.fun sama sekali (mine.length === 0), atau
          //    (b) entry terakhir gagal check (status failed/rejected)
          const makefunRepos = existingRepos.filter(r => r.name.toLowerCase().startsWith("makefun-"));
          for (const repo of makefunRepos) {
            const slug = repo.name.slice("makefun-".length);
            try {
              const compRes = await fetch(`https://make.fun/api/competitions/${slug}`, { headers });
              if (!compRes.ok) continue;
              const compJson = await compRes.json();
              const compObj = compJson.competition || compJson.data || compJson;
              if (!isStillAccepting(compObj)) continue;

              let reqObj = {};
              try {
                const reqRes = await fetch(`https://make.fun/api/competitions/${slug}/requirements`, { headers });
                if (reqRes.ok) reqObj = await reqRes.json();
              } catch {}

              if (!hasWalletKey && requiresWalletSignature(compObj, reqObj)) continue;

              let compSubs = [];
              try {
                const subsRes = await fetch(`https://make.fun/api/competitions/${slug}/submissions`, { headers });
                if (subsRes.ok) {
                  const subsJson = await subsRes.json();
                  compSubs = Array.isArray(subsJson) ? subsJson : (subsJson.submissions || subsJson.items || subsJson.data || []);
                }
              } catch {}

              const combined = [...myGlobalSubs, ...compSubs];
              const seenIds = new Set();
              const mine = combined.filter(s => {
                const sid = String(s.id || s.submission_id || "");
                if (sid && seenIds.has(sid)) return false;
                if (sid) seenIds.add(sid);
                const sSlug = String(s.competition || s.competition_slug || s.slug || "").toLowerCase();
                const sRepo = String(s.repo || s.repo_url || "").toLowerCase();
                return sSlug === slug.toLowerCase() || sRepo.includes(repo.name.toLowerCase());
              });

              if (mine.length === 0) {
                mode = "retry_submit";
                targetSlug = slug;
                targetTitle = compObj.title || compObj.name || slug;
                failedDetail = "Repo sudah ada di GitHub namun belum tercatat di make.fun. Melakukan penandatanganan & submit ulang.";
                break;
              }

              if (mine.length >= 5) continue;

              mine.sort((a, b) => {
                const rDiff = Number(b.round || 0) - Number(a.round || 0);
                if (rDiff !== 0) return rDiff;
                return String(b.created_at || b.server_time || "").localeCompare(String(a.created_at || a.server_time || ""));
              });

              const latest = mine[0];
              const subId = latest.id || latest.submission_id;
              let detailObj = latest;
              let extraChecks = null;
              if (subId) {
                const detRes = await fetch(`https://make.fun/api/submissions/${subId}`, { headers });
                if (detRes.ok) detailObj = await detRes.json();
                for (const subPath of ["checks", "hindsight"]) {
                  try {
                    const cRes = await fetch(`https://make.fun/api/submissions/${subId}/${subPath}`, { headers });
                    if (cRes.ok) {
                      extraChecks = extraChecks || {};
                      extraChecks[subPath] = await cRes.json();
                    }
                  } catch {}
                }
              }

              const subStatus = String(detailObj.status || "").toLowerCase();
              if (/submitting|preparing|checking|queued|scoring|scored|valid/i.test(subStatus)) continue;

              if (/fail|reject|error/i.test(subStatus)) {
                const cleanObj = {};
                for (const [k, v] of Object.entries(detailObj)) {
                  if (v !== null && v !== "" && !/transcript/i.test(k)) cleanObj[k] = v;
                }
                if (extraChecks) cleanObj.extra_checks = extraChecks;
                mode = "fix
