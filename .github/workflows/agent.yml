name: Binance Agent 24/7 Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-command]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git & GitHub Auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Screampie333"
          git config --global user.email "screampie333@users.noreply.github.com"
          git config --global init.defaultBranch main
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install OpenClaw, make.fun Skill & Web3 Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g openclaw@latest

          mkdir -p "$HOME/.openclaw/workspace"
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice gemini-api-key \
            --gemini-api-key "$GEMINI_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          openclaw config set tools.profile full || true
          openclaw config set agents.defaults.models '{"google/gemini-2.5-flash":{},"google/gemini-3.1-flash-lite":{},"groq/llama-3.3-70b-versatile":{}}' --strict-json --merge || true
          openclaw models set google/gemini-2.5-flash || true
          openclaw models fallbacks add google/gemini-3.1-flash-lite || true
          openclaw models fallbacks add groq/llama-3.3-70b-versatile || true

          cp AGENTS.md "$HOME/.openclaw/workspace/AGENTS.md"
          printf "GEMINI_API_KEY=%s\nGOOGLE_API_KEY=%s\nGROQ_API_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nMAKEFUN_API_KEY=%s\n" \
            "$GEMINI_API_KEY" "$GEMINI_API_KEY" "$GROQ_API_KEY" "$TELEGRAM_BOT_TOKEN" "$MAKEFUN_API_KEY" > "$HOME/.openclaw/.env"
          chmod 600 "$HOME/.openclaw/.env"

          cd "$HOME/.openclaw/workspace"
          npx -y skills add binance/binance-skills-hub/skills/binance-web3 --all --agent '*' -y
          rm -rf "$HOME/.openclaw/workspace/skills"
          mkdir -p "$HOME/.openclaw/workspace/skills/makefun"
          for s in query-token-audit query-token-info; do
            cp -r "$HOME/.openclaw/workspace/.agents/skills/$s" "$HOME/.openclaw/workspace/skills/"
          done
          rm -rf "$HOME/.openclaw/workspace/.agents"

          curl -fsSL "https://make.fun/skill.md" -o "$HOME/.openclaw/workspace/skills/makefun/SKILL.md"
          curl -fsSL "https://make.fun/heartbeat.md" -o "$HOME/.openclaw/workspace/skills/makefun/heartbeat.md" || true

      - name: Cleanup Closed & Unsubmitted makefun-* Repos
        env:
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/cleanup_repos.mjs
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const envFile = process.env.GITHUB_ENV;
          function setEnv(name, value) {
            const delim = `EOF_${name}_${Date.now()}`;
            fs.appendFileSync(envFile, `${name}<<${delim}\n${value}\n${delim}\n`);
          }

          const headers = { Accept: "application/json" };
          if (process.env.MAKEFUN_API_KEY) headers["x-api-key"] = process.env.MAKEFUN_API_KEY;

          let repos = [];
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync(
                "gh",
                ["repo", "list", "Screampie333", "--limit", "100", "--json", "name,createdAt"],
                { encoding: "utf8", timeout: 30000 }
              );
              repos = JSON.parse(out || "[]");
            }
          } catch {}

          let myGlobalSubs = [];
          try {
            const meRes = await fetch("https://make.fun/api/me/submissions?limit=200", { headers });
            if (meRes.ok) {
              const meJson = await meRes.json();
              myGlobalSubs = Array.isArray(meJson) ? meJson : (meJson.submissions || meJson.items || meJson.data || []);
            }
          } catch {}

          const deletedList = [];
          let permWarning = "";

          for (const repo of repos) {
            if (!repo.name.toLowerCase().startsWith("makefun-")) continue;

            // Jaga repo yang baru dibuat < 30 menit agar tidak bentrok
            if (repo.createdAt) {
              const ageMs = Date.now() - new Date(repo.createdAt).getTime();
              if (!Number.isNaN(ageMs) && ageMs < 30 * 60 * 1000) continue;
            }

            const slug = repo.name.slice("makefun-".length);
            let isClosed = false;

            try {
              const compRes = await fetch(`https://make.fun/api/competitions/${slug}`, { headers });
              if (compRes.status === 404) {
                isClosed = true;
              } else if (compRes.ok) {
                const compJson = await compRes.json();
                const compObj = compJson.competition || compJson.data || compJson;
                const accepting = compObj.acceptingSubmissions ?? compObj.accepting_submissions;
                const status = String(compObj.status || "").toLowerCase();
                const closeRaw = compObj.closesAt || compObj.closes_at || compObj.submissionsCloseAt || compObj.deadline || compObj.endAt;
                const closeMs = closeRaw ? new Date(closeRaw).getTime() : NaN;

                if (accepting === false && (/closed|resolved|settled|ended|cancelled/i.test(status) || (!Number.isNaN(closeMs) && closeMs < Date.now()))) {
                  isClosed = true;
                }
              }
            } catch {}

            if (!isClosed) continue;

            // Pastikan 0 submission di make.fun (jangan hapus repo yang sudah masuk penilaian)
            let compSubs = [];
            try {
              const subsRes = await fetch(`https://make.fun/api/competitions/${slug}/submissions`, { headers });
              if (subsRes.ok) {
                const subsJson = await subsRes.json();
                compSubs = Array.isArray(subsJson) ? subsJson : (subsJson.submissions || subsJson.items || subsJson.data || []);
              }
            } catch {}

            const hasSubmission = [...myGlobalSubs, ...compSubs].some(s => {
              const sSlug = String(s.competition || s.competition_slug || s.slug || "").toLowerCase();
              const sRepo = String(s.repo || s.repo_url || "").toLowerCase();
              return sSlug === slug.toLowerCase() || sRepo.includes(repo.name.toLowerCase());
            });

            if (hasSubmission) continue;

            try {
              execFileSync("gh", ["repo", "delete", `Screampie333/${repo.name}`, "--yes"], {
                encoding: "utf8",
                timeout: 30000
              });
              deletedList.push(repo.name);
            } catch (err) {
              const msg = `${err.stderr || err.message || ""}`;
              if (/delete_repo|403|scope/i.test(msg)) {
                permWarning = "⚠️ GH_PAT belum memiliki izin 'delete_repo', pembersihan repo dilewati.";
                break;
              }
            }
          }

          setEnv("CLEANED_REPOS", deletedList.join(", "));
          setEnv("CLEANUP_WARNING", permWarning);
          EOF
          node /tmp/cleanup_repos.mjs

      - name: Select Unsubmitted / Failed Repo or New Active Free Bounty
        env:
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/select_bounty.mjs
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const envFile = process.env.GITHUB_ENV;
          function setEnv(name, value) {
            const delim = `EOF_${name}_${Date.now()}`;
            fs.appendFileSync(envFile, `${name}<<${delim}\n${value}\n${delim}\n`);
          }

          async function getGas(name, rpcUrl) {
            try {
              const res = await fetch(rpcUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_gasPrice", params: [] })
              });
              const json = await res.json();
              const wei = BigInt(json.result || "0x0");
              const gwei = (Number(wei) / 1e9).toFixed(3);
              return `${name}: ${gwei} Gwei`;
            } catch {
              return `${name}: unavailable`;
            }
          }

          const gasList = await Promise.all([
            getGas("BSC (Chain 56)", "https://bsc-dataseed.binance.org"),
            getGas("Base (Chain 8453)", "https://mainnet.base.org"),
            getGas("Ethereum (Chain 1)", "https://eth.llamarpc.com")
          ]);
          setEnv("GAS_REPORT", gasList.join(" | "));

          let existingRepos = [];
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync("gh", ["repo", "list", "Screampie333", "--limit", "100", "--json", "name,url"], { encoding: "utf8", timeout: 30000 });
              existingRepos = JSON.parse(out || "[]");
            }
          } catch {}
          const existingNames = existingRepos.map(r => r.name.toLowerCase());

          const headers = { Accept: "application/json" };
          if (process.env.MAKEFUN_API_KEY) headers["x-api-key"] = process.env.MAKEFUN_API_KEY;
          const hasWalletKey = Boolean((process.env.SOLANA_PRIVATE_KEY || "").trim());

          function isStillAccepting(compObj) {
            const accepting = compObj.acceptingSubmissions ?? compObj.accepting_submissions;
            if (accepting !== true) return false;
            const closeRaw = compObj.closesAt || compObj.closes_at || compObj.submissionsCloseAt || compObj.deadline || compObj.endAt;
            if (closeRaw) {
              const closeMs = new Date(closeRaw).getTime();
              if (!Number.isNaN(closeMs) && closeMs <= Date.now() + 5 * 60 * 1000) return false;
            }
            return true;
          }

          function requiresWalletSignature(compObj, reqObj) {
            if (compObj?.escrowed === true || compObj?.requiresSignature === true || compObj?.requires_signature === true) return true;
            if (reqObj?.how_to_submit?.entry_message_template || reqObj?.entry_message_template) return true;
            return false;
          }

          let myGlobalSubs = [];
          try {
            const meRes = await fetch("https://make.fun/api/me/submissions?limit=100", { headers });
            if (meRes.ok) {
              const meJson = await meRes.json();
              myGlobalSubs = Array.isArray(meJson) ? meJson : (meJson.submissions || meJson.items || meJson.data || []);
            }
          } catch {}

          let mode = "new";
          let targetSlug = "";
          let targetTitle = "";
          let failedDetail = "";

          // 1. Cek repo GitHub makefun-* yang masih open:
          //    (a) belum pernah masuk ke make.fun sama sekali (mine.length === 0), atau
          //    (b) entry terakhir gagal check (status failed/rejected)
          const makefunRepos = existingRepos.filter(r => r.name.toLowerCase().startsWith("makefun-"));
          for (const repo of makefunRepos) {
            const slug = repo.name.slice("makefun-".length);
            try {
              const compRes = await fetch(`https://make.fun/api/competitions/${slug}`, { headers });
              if (!compRes.ok) continue;
              const compJson = await compRes.json();
              const compObj = compJson.competition || compJson.data || compJson;
              if (!isStillAccepting(compObj)) continue;

              let reqObj = {};
              try {
                const reqRes = await fetch(`https://make.fun/api/competitions/${slug}/requirements`, { headers });
                if (reqRes.ok) reqObj = await reqRes.json();
              } catch {}

              if (!hasWalletKey && requiresWalletSignature(compObj, reqObj)) continue;

              let compSubs = [];
              try {
                const subsRes = await fetch(`https://make.fun/api/competitions/${slug}/submissions`, { headers });
                if (subsRes.ok) {
                  const subsJson = await subsRes.json();
                  compSubs = Array.isArray(subsJson) ? subsJson : (subsJson.submissions || subsJson.items || subsJson.data || []);
                }
              } catch {}

              const combined = [...myGlobalSubs, ...compSubs];
              const seenIds = new Set();
              const mine = combined.filter(s => {
                const sid = String(s.id || s.submission_id || "");
                if (sid && seenIds.has(sid)) return false;
                if (sid) seenIds.add(sid);
                const sSlug = String(s.competition || s.competition_slug || s.slug || "").toLowerCase();
                const sRepo = String(s.repo || s.repo_url || "").toLowerCase();
                return sSlug === slug.toLowerCase() || sRepo.includes(repo.name.toLowerCase());
              });

              if (mine.length === 0) {
                mode = "retry_submit";
                targetSlug = slug;
                targetTitle = compObj.title || compObj.name || slug;
                failedDetail = "Repo sudah ada di GitHub namun belum tercatat di make.fun. Melakukan penandatanganan & submit ulang.";
                break;
              }

              if (mine.length >= 5) continue;

              mine.sort((a, b) => {
                const rDiff = Number(b.round || 0) - Number(a.round || 0);
                if (rDiff !== 0) return rDiff;
                return String(b.created_at || b.server_time || "").localeCompare(String(a.created_at || a.server_time || ""));
              });

              const latest = mine[0];
              const subId = latest.id || latest.submission_id;
              let detailObj = latest;
              let extraChecks = null;
              if (subId) {
                const detRes = await fetch(`https://make.fun/api/submissions/${subId}`, { headers });
                if (detRes.ok) detailObj = await detRes.json();
                for (const subPath of ["checks", "hindsight"]) {
                  try {
                    const cRes = await fetch(`https://make.fun/api/submissions/${subId}/${subPath}`, { headers });
                    if (cRes.ok) {
                      extraChecks = extraChecks || {};
                      extraChecks[subPath] = await cRes.json();
                    }
                  } catch {}
                }
              }

              const subStatus = String(detailObj.status || "").toLowerCase();
              if (/submitting|preparing|checking|queued|scoring|scored|valid/i.test(subStatus)) continue;

              if (/fail|reject|error/i.test(subStatus)) {
                const cleanObj = {};
                for (const [k, v] of Object.entries(detailObj)) {
                  if (v !== null && v !== "" && !/transcript/i.test(k)) cleanObj[k] = v;
                }
                if (extraChecks) cleanObj.extra_checks = extraChecks;
                mode = "fix";
                targetSlug = slug;
                targetTitle = compObj.title || compObj.name || slug;
                failedDetail = JSON.stringify(cleanObj, null, 2);
                break;
              }
            } catch {}
          }

          // 2. Cari bounty GRATIS ($0) baru yang acceptingSubmissions === true
          if (!targetSlug) {
            try {
              const res = await fetch("https://make.fun/api/competitions?status=open&limit=200", { headers });
              const data = await res.json();
              const list = Array.isArray(data) ? data : (data.competitions || data.items || data.data || []);
              const candidates = list.filter(item => {
                const slug = String(item.slug || item.id || "").toLowerCase();
                const fee = Number(item.entryFee ?? item.entry_fee ?? item.fee ?? item.price ?? 0);
                const alreadyBuilt = existingNames.some(n => n === `makefun-${slug}` || n.includes(slug));
                return slug && fee === 0 && !alreadyBuilt;
              });

              for (const c of candidates) {
                const slug = c.slug || c.id;
                try {
                  const compRes = await fetch(`https://make.fun/api/competitions/${slug}`, { headers });
                  if (!compRes.ok) continue;
                  const compJson = await compRes.json();
                  const compObj = compJson.competition || compJson.data || compJson;
                  if (!isStillAccepting(compObj)) continue;

                  const exactFee = Number(compObj.entryFee ?? compObj.entry_fee ?? compObj.fee ?? 0);
                  if (exactFee > 0) continue;

                  let reqObj = {};
                  const reqRes = await fetch(`https://make.fun/api/competitions/${slug}/requirements`, { headers });
                  if (reqRes.ok) {
                    reqObj = await reqRes.json();
                    const prereqs = Array.isArray(reqObj) ? reqObj : (reqObj.prerequisites || []);
                    const hasHumanStep = prereqs.some(p => p.required !== false);
                    if (hasHumanStep) continue;
                  }

                  if (!hasWalletKey && requiresWalletSignature(compObj, reqObj)) continue;

                  mode = "new";
                  targetSlug = slug;
                  targetTitle = compObj.title || compObj.name || c.title || slug;
                  break;
                } catch {}
              }
            } catch {}
          }

          setEnv("BUILD_MODE", mode);
          setEnv("TARGET_SLUG", targetSlug);
          setEnv("TARGET_TITLE", targetTitle);
          setEnv("FAILED_DETAIL", failedDetail);
          EOF
          node /tmp/select_bounty.mjs

      - name: Build / Auto-Fix, Sign Ed25519 Entry, Push & Submit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/build_and_submit.mjs
          import { execFileSync } from "node:child_process";
          import crypto from "node:crypto";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          const home = os.homedir();
          const workspace = path.join(home, ".openclaw", "workspace");
          const env = {
            ...process.env,
            PATH: `${path.join(home, ".npm-global", "bin")}:${process.env.PATH || ""}`
          };

          const mode = (process.env.BUILD_MODE || "new").trim();
          const slug = (process.env.TARGET_SLUG || "").trim();
          const title = (process.env.TARGET_TITLE || slug).trim();
          const failedDetail = (process.env.FAILED_DETAIL || "").trim();
          const cleanedRepos = (process.env.CLEANED_REPOS || "").trim();
          const cleanupWarning = (process.env.CLEANUP_WARNING || "").trim();
          const gas = process.env.GAS_REPORT || "";
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          const apiKey = process.env.MAKEFUN_API_KEY || "";
          const solanaSecretRaw = (process.env.SOLANA_PRIVATE_KEY || "").trim();

          async function notify(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: chatId, text: text.slice(0, 3900) })
            });
          }

          const cleanupSummary = [
            cleanedRepos ? `🧹 Repo tutup & kosong terhapus: ${cleanedRepos}` : "",
            cleanupWarning
          ].filter(Boolean).join("\n");

          if (!slug) {
            const walletHint = !solanaSecretRaw
              ? "\n💡 Tips: Tambahkan secret SOLANA_PRIVATE_KEY di GitHub agar agen bisa mengikuti bounty escrowed."
              : "";
            const idleMsg = [
              `ℹ️ Tidak ada entry tertunda maupun bounty gratis ($0) aktif yang siap diikuti saat ini.${walletHint}`,
              cleanupSummary,
              `⛽ ${gas}`
            ].filter(Boolean).join("\n\n");
            await notify(idleMsg);
            process.exit(0);
          }

          // --- Helper Base58 & Ed25519 Solana ---
          const B58_ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
          function b58Encode(bytes) {
            const digits = [0];
            for (let i = 0; i < bytes.length; i++) {
              let carry = bytes[i];
              for (let j = 0; j < digits.length; j++) {
                carry += digits[j] << 8;
                digits[j] = carry % 58;
                carry = (carry / 58) | 0;
              }
              while (carry > 0) {
                digits.push(carry % 58);
                carry = (carry / 58) | 0;
              }
            }
            let out = "";
            for (let i = 0; i < bytes.length && bytes[i] === 0; i++) out += "1";
            for (let i = digits.length - 1; i >= 0; i--) out += B58_ALPHABET[digits[i]];
            return out;
          }

          function b58Decode(str) {
            const bytes = [0];
            for (let i = 0; i < str.length; i++) {
              const val = B58_ALPHABET.indexOf(str[i]);
              if (val < 0) throw new Error("Invalid base58 character");
              let carry = val;
              for (let j = 0; j < bytes.length; j++) {
                carry += bytes[j] * 58;
                bytes[j] = carry & 0xff;
                carry >>= 8;
              }
              while (carry > 0) {
                bytes.push(carry & 0xff);
                carry >>= 8;
              }
            }
            for (let i = 0; i < str.length && str[i] === "1"; i++) bytes.push(0);
            return Uint8Array.from(bytes.reverse());
          }

          function computeTranscriptsDigest(fileHashes) {
            const sorted = [...fileHashes].sort();
            const combiners = [
              h => crypto.createHash("sha256").update(h.join("\n"), "utf8").digest("hex"),
              h => crypto.createHash("sha256").update(h.join("\n") + "\n", "utf8").digest("hex"),
              h => crypto.createHash("sha256").update(JSON.stringify(h), "utf8").digest("hex"),
              h => crypto.createHash("sha256").update(h.join(","), "utf8").digest("hex"),
              h => crypto.createHash("sha256").update(Buffer.concat(h.map(x => Buffer.from(x, "hex")))).digest("hex")
            ];
            const testIn = ["287b8f1fb1a7b07f4c47385e3e6254d05c63faa93f9e0821e519b12a5e0d5dc9"];
            const testExpected = "fc28124569a0de351629847ec81b3c8701b52e3967e18163cb0852a00a0d70d1";
            const matched = combiners.find(fn => fn(testIn) === testExpected) || combiners[0];
            return matched(sorted);
          }

          let walletSigner = null;
          if (solanaSecretRaw) {
            try {
              let rawBytes;
              if (solanaSecretRaw.startsWith("[")) {
                rawBytes = Uint8Array.from(JSON.parse(solanaSecretRaw));
              } else {
                rawBytes = b58Decode(solanaSecretRaw);
              }
              const seed32 = rawBytes.slice(0, 32);
              const pkcs8Header = Buffer.from("302e020100300506032b657004220420", "hex");
              const privKeyObj = crypto.createPrivateKey({
                key: Buffer.concat([pkcs8Header, Buffer.from(seed32)]),
                format: "der",
                type: "pkcs8"
              });
              const spkiDer = crypto.createPublicKey(privKeyObj).export({ type: "spki", format: "der" });
              const pub32 = new Uint8Array(spkiDer.subarray(spkiDer.length - 32));
              const full64 = Array.from(Uint8Array.from([...seed32, ...pub32]));
              const keypairPath = "/tmp/solana_keypair.json";
              fs.writeFileSync(keypairPath, JSON.stringify(full64));
              walletSigner = {
                address: b58Encode(pub32),
                keypairPath,
                signUtf8(msg) {
                  const sigBytes = crypto.sign(null, Buffer.from(msg, "utf8"), privKeyObj);
                  return b58Encode(new Uint8Array(sigBytes));
                }
              };
            } catch (err) {
              await notify(`⚠️ Format SOLANA_PRIVATE_KEY tidak valid: ${err.message}`);
              process.exit(1);
            }
          }

          const owner = "Screampie333";
          const repoName = `makefun-${slug}`;
          const repoFull = `${owner}/${repoName}`;
          const repoUrl = `https://github.com/${repoFull}`;
          const bountyUrl = `https://make.fun/bounty/${slug}`;

          let compData = {};
          let reqData = {};
          try {
            const cRes = await fetch(`https://make.fun/api/competitions/${slug}`, {
              headers: { Accept: "application/json", "x-api-key": apiKey }
            });
            if (cRes.ok) {
              const j = await cRes.json();
              compData = j.competition || j.data || j;
            }
          } catch {}
          try {
            const reqRes = await fetch(`https://make.fun/api/competitions/${slug}/requirements`, {
              headers: { Accept: "application/json", "x-api-key": apiKey }
            });
            if (reqRes.ok) reqData = await reqRes.json();
          } catch {}

          const workDir = `/tmp/work-${slug}`;
          fs.rmSync(workDir, { recursive: true, force: true });

          if (mode === "fix" || mode === "retry_submit") {
            try {
              execFileSync("git", ["clone", `${repoUrl}.git`, workDir], { env, timeout: 60000 });
            } catch {
              fs.mkdirSync(workDir, { recursive: true });
            }
          } else {
            fs.mkdirSync(workDir, { recursive: true });
          }

          const kitUrl = compData.kitUrl || compData.kit_url || reqData.kitUrl || reqData.kit_url || `https://make.fun/api/competitions/${slug}/kit`;
          try {
            const kitRes = await fetch(kitUrl, { headers: { "x-api-key": apiKey } });
            if (kitRes.ok) {
              const buf = Buffer.from(await kitRes.arrayBuffer());
              if (buf.length > 100 && buf[0] === 0x50 && buf[1] === 0x4b) {
                const zipPath = `/tmp/kit-${slug}.zip`;
                fs.writeFileSync(zipPath, buf);
                execFileSync("unzip", ["-oq", zipPath, "-d", workDir], { timeout: 30000 });
              }
            }
          } catch {}

          const kitCliPath = path.join(workDir, "cli", "makefun.mjs");
          if (walletSigner && fs.existsSync(kitCliPath)) {
            try {
              execFileSync("node", [kitCliPath, "wallet", "add", "--keypair", walletSigner.keypairPath], {
                cwd: workDir,
                env: { ...env, MAKEFUN_API_KEY: apiKey },
                timeout: 30000
              });
            } catch {}
          }

          const sessionId = `makefun-${slug}-${Date.now()}`;
          let buildWarning = "";

          if (mode !== "retry_submit") {
            const buildPrompt = mode === "fix"
              ? [
                  `MODE AUTO-FIX: Submission sebelumnya untuk bounty "${slug}" (${title}) di "${workDir}" GAGAL pada pengecekan make.fun.`,
                  "Detail error resmi dari API make.fun:",
                  failedDetail.slice(0, 4000),
                  "",
                  "Instruksi perbaikan cepat (WAJIB selesai di bawah 60 detik, maksimal 4 tool call; JANGAN jalankan benchmark/simulasi lama, JANGAN git push, JANGAN submit API):",
                  `1) Baca RULES.txt dan periksa file kode yang sudah ada di "${workDir}".`,
                  `2) Perbaiki penyebab kegagalan pada JSON error di atas menggunakan tool tulis/edit file.`,
                  `3) Jalankan cek syntax/ukuran cepat (< 3 detik) di "${workDir}", lalu langsung selesai.`
                ].join("\n")
              : [
                  `Kit bounty "${slug}" (${title}) sudah diekstrak di "${workDir}".`,
                  "PENTING: Selesaikan dalam waktu di bawah 60 detik (maksimal 4 tool call). JANGAN unduh kit ulang, JANGAN jalankan benchmark lama, JANGAN gh repo create, dan JANGAN submit API.",
                  `1) Baca RULES.txt di "${workDir}" dan quote baris anchor di output tool pertama.`,
                  `2) Tulis file kode utama yang bersih & mematuhi batas ukuran di "${workDir}".`,
                  `3) Jalankan verifikasi cepat (< 3 detik) di "${workDir}", lalu langsung akhiri sesi dengan ringkasan 2 kalimat.`
                ].join("\n");

            try {
              execFileSync(
                "openclaw",
                ["agent", "--local", "--session-id", sessionId, "--timeout", "180", "--json", "--message", buildPrompt],
                {
                  cwd: workspace,
                  env,
                  encoding: "utf8",
                  timeout: 210000,
                  killSignal: "SIGKILL",
                  maxBuffer: 25 * 1024 * 1024
                }
              );
            } catch (err) {
              buildWarning = `⚠️ Catatan sesi: ${(err.message || "").slice(0, 160)}`;
            }
          }

          const files = fs.readdirSync(workDir).filter(f => !f.startsWith("."));
          if (files.length === 0) {
            await notify(`⚠️ Direktori ${workDir} kosong setelah OpenClaw selesai.\n${buildWarning}\n\n⛽ ${gas}`);
            process.exit(1);
          }

          const licensePath = path.join(workDir, "LICENSE");
          if (!fs.existsSync(licensePath)) {
            const mitLicense = [
              "SPDX-License-Identifier: MIT",
              "",
              "MIT License",
              "",
              "Copyright (c) 2026 Screampie333",
              "",
              "Permission is hereby granted, free of charge, to any person obtaining a copy",
              "of this software and associated documentation files (the \"Software\"), to deal",
              "in the Software without restriction, including without limitation the rights",
              "to use, copy, modify, merge, publish, distribute, sublicense, and/or sell",
              "copies of the Software, and to permit persons to whom the Software is",
              "furnished to do so, subject to the following conditions:",
              "",
              "The above copyright notice and this permission notice shall be included in all",
              "copies or substantial portions of the Software.",
              "",
              "THE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR",
              "IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,",
              "FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE",
              "AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER",
              "LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,",
              "OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE",
              "SOFTWARE."
            ].join("\n");
            fs.writeFileSync(licensePath, mitLicense);
          }

          const badgeComp = `https://make.fun/badge/${slug}.svg`;
          const badgeRank = `https://make.fun/badge/${slug}/${owner}/${repoName}/rank.svg`;
          const badgeReward = `https://make.fun/badge/${slug}/${owner}/${repoName}/reward.svg`;
          const badgeHeader = [
            `[![make.fun](${badgeComp})](${bountyUrl})`,
            `[![Rank](${badgeRank})](${bountyUrl})`,
            `[![Reward](${badgeReward})](${bountyUrl})`,
            "",
            `Official entry for [${title}](${bountyUrl}) on [make.fun](https://make.fun).`
          ].join("\n");

          const readmePath = path.join(workDir, "README.md");
          const existingReadme = fs.existsSync(readmePath) ? fs.readFileSync(readmePath, "utf8") : "";
          const templateRaw = reqData?.how_to_submit?.readme_template || reqData?.readme_template || "";

          let finalReadme = existingReadme;
          if (!finalReadme && templateRaw) {
            const runCmd = fs.existsSync(path.join(workDir, "main.py")) ? "python3 main.py" : "node index.js";
            finalReadme = String(templateRaw)
              .replaceAll("{owner}", owner).replaceAll("<owner>", owner)
              .replaceAll("{repo}", repoName).replaceAll("<repo>", repoName)
              .replaceAll("{slug}", slug).replaceAll("<slug>", slug)
              .replaceAll("{description}", title).replaceAll("<description>", title)
              .replaceAll("{run_command}", runCmd).replaceAll("<run_command>", runCmd)
              .replaceAll("{referral_code}", "").replaceAll("<referral_code>", "");
          } else if (!finalReadme) {
            finalReadme = `# ${title}\n\nAutonomous entry for ${slug}.\n`;
          }

          if (!finalReadme.includes(badgeComp) || !finalReadme.includes(badgeRank) || !finalReadme.includes(badgeReward) || !finalReadme.includes(bountyUrl)) {
            finalReadme = `${badgeHeader}\n\n---\n\n${finalReadme}`;
          }
          fs.writeFileSync(readmePath, finalReadme);

          let commitSha = "";
          try {
            fs.writeFileSync(path.join(workDir, ".gitignore"), "__pycache__/\n*.pyc\nnode_modules/\n.env\n");
            if (!fs.existsSync(path.join(workDir, ".git"))) {
              execFileSync("git", ["init"], { cwd: workDir, env, timeout: 30000 });
            }
            execFileSync("git", ["add", "-A"], { cwd: workDir, env, timeout: 30000 });
            execFileSync(
              "git",
              ["commit", "--allow-empty", "-m", mode === "fix" ? `Auto-fix check failure for ${slug}` : `Entry for ${slug}`],
              { cwd: workDir, env, timeout: 30000 }
            );
            commitSha = execFileSync("git", ["rev-parse", "HEAD"], { cwd: workDir, env, encoding: "utf8", timeout: 30000 }).trim();

            let repoExists = false;
            try {
              execFileSync("gh", ["repo", "view", repoFull], { cwd: workDir, env, stdio: "ignore", timeout: 30000 });
              repoExists = true;
            } catch {}

            if (repoExists) {
              try { execFileSync("git", ["remote", "remove", "origin"], { cwd: workDir, env, stdio: "ignore", timeout: 15000 }); } catch {}
              execFileSync("git", ["remote", "add", "origin", `${repoUrl}.git`], { cwd: workDir, env, timeout: 30000 });
              execFileSync("git", ["push", "-u", "origin", "main", "--force"], { cwd: workDir, env, timeout: 60000 });
            } else {
              execFileSync("gh", ["repo", "create", repoFull, "--public", "--source=.", "--remote=origin", "--push"], { cwd: workDir, env, timeout: 60000 });
            }

            const aboutHomepage = reqData?.how_to_submit?.homepage || bountyUrl;
            const aboutDesc = (reqData?.how_to_submit?.description || `${title} — Built for make.fun (${bountyUrl})`).slice(0, 300);
            execFileSync(
              "gh",
              ["repo", "edit", repoFull, "--description", aboutDesc, "--homepage", aboutHomepage, "--add-topic", "makefun"],
              { cwd: workDir, env, timeout: 30000 }
            );
          } catch (err) {
            await notify(`⚠️ Gagal push ke GitHub (${repoFull}):\n${(err.message || "").slice(0, 600)}`);
            process.exit(1);
          }

          await new Promise(resolve => setTimeout(resolve, 4000));

          function scanOpenclawFiles(dir, results = []) {
            if (!fs.existsSync(dir)) return results;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) scanOpenclawFiles(fullPath, results);
              else if (/\.(jsonl|db|sqlite|sqlite3)$/i.test(entry.name)) {
                results.push({ fullPath, name: entry.name, size: fs.statSync(fullPath).size });
              }
            }
            return results;
          }

          const foundFiles = scanOpenclawFiles(path.join(home, ".openclaw"));
          let transcriptLines = [];

          const jsonlFiles = foundFiles.filter(f => f.name.endsWith(".jsonl") && f.size > 0).sort((a, b) => b.size - a.size);
          if (jsonlFiles.length > 0) {
            const rawLines = fs.readFileSync(jsonlFiles[0].fullPath, "utf8").split("\n").filter(Boolean);
            for (const line of rawLines) {
              try { transcriptLines.push(JSON.parse(line)); } catch { transcriptLines.push({ raw: line }); }
            }
          }

          if (transcriptLines.length === 0) {
            const dbFiles = foundFiles.filter(f => /\.(db|sqlite|sqlite3)$/i.test(f.name) && f.size > 0).sort((a, b) => b.size - a.size);
            try {
              const { DatabaseSync } = await import("node:sqlite");
              for (const dbFile of dbFiles) {
                const db = new DatabaseSync(dbFile.fullPath, { readOnly: true });
                const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map(t => t.name);
                for (const tbl of tables) {
                  if (/message|turn|event|session|log|step|tool/i.test(tbl)) {
                    const rows = db.prepare(`SELECT * FROM "${tbl}" LIMIT 500`).all();
                    for (const row of rows) {
                      const enriched = { table: tbl };
                      for (const [k, v] of Object.entries(row)) {
                        if (typeof v === "string" && (v.startsWith("{") || v.startsWith("["))) {
                          try { enriched[k] = JSON.parse(v); } catch { enriched[k] = v; }
                        } else {
                          enriched[k] = v;
                        }
                      }
                      transcriptLines.push(enriched);
                    }
                  }
                }
                db.close();
                if (transcriptLines.length > 0) break;
              }
            } catch {}
          }

          if (transcriptLines.length === 0) {
            transcriptLines.push({
              type: "session",
              sessionId,
              slug,
              repo: repoUrl,
              commit: commitSha,
              timestamp: new Date().toISOString()
            });
          }

          const transcriptRaw = transcriptLines.map(e => JSON.stringify(e)).join("\n");
          const transcriptPath = "/tmp/openclaw_session_backup.jsonl";
          fs.writeFileSync(transcriptPath, transcriptRaw);

          const submitUrl = `https://make.fun/api/competitions/${slug}/submissions`;
          let submitResultText = "";

          if (walletSigner && fs.existsSync(kitCliPath)) {
            try {
              const cliOut = execFileSync(
                "node",
                [
                  kitCliPath,
                  "submit",
                  "--keypair", walletSigner.keypairPath,
                  "--repo", repoUrl,
                  "--commit", commitSha,
                  "--transcript", transcriptPath
                ],
                {
                  cwd: workDir,
                  env: { ...env, MAKEFUN_API_KEY: apiKey },
                  encoding: "utf8",
                  timeout: 60000
                }
              );
              submitResultText = `CLI Submit OK:\n${cliOut.slice(0, 1400)}`;
            } catch (cliErr) {
              const errOut = `${cliErr.stdout || ""}\n${cliErr.stderr || ""}`.trim();
              submitResultText = `CLI fallback ke API langsung (${errOut.slice(0, 200)})\n`;
            }
          }

          if (!submitResultText || submitResultText.startsWith("CLI fallback")) {
            const msgTemplate = reqData?.how_to_submit?.entry_message_template || reqData?.entry_message_template || "";
            const singleFileSha = crypto.createHash("sha256").update(Buffer.from(transcriptRaw, "utf8")).digest("hex");
            let expectedTranscriptsDigest = computeTranscriptsDigest([singleFileSha]);

            async function postSignedSubmission(transcriptsDigest) {
              const fd = new FormData();
              fd.append("repo_url", repoUrl);
              fd.append("commit_sha", commitSha);
              fd.append("title", title.slice(0, 200));
              fd.append("transcripts", new Blob([transcriptRaw], { type: "application/x-ndjson" }), "session.jsonl");

              let filledMsg = "";
              if (walletSigner && msgTemplate) {
                const nonce = crypto.randomBytes(16).toString("hex");
                const nowIso = new Date().toISOString();
                const expiresIso = new Date(Date.now() + 9 * 60 * 1000).toISOString();

                filledMsg = String(msgTemplate)
                  .replace(/\r\n/g, "\n")
                  .replaceAll("{nonce}", nonce).replaceAll("<nonce>", nonce)
                  .replaceAll("{competition}", slug).replaceAll("<competition>", slug)
                  .replaceAll("{slug}", slug).replaceAll("<slug>", slug)
                  .replaceAll("{repo_url}", repoUrl).replaceAll("<repo_url>", repoUrl)
                  .replaceAll("{repo}", repoUrl).replaceAll("<repo>", repoUrl)
                  .replaceAll("{repository}", repoUrl).replaceAll("<repository>", repoUrl)
                  .replaceAll("{commit_sha}", commitSha).replaceAll("<commit_sha>", commitSha)
                  .replaceAll("{commit}", commitSha).replaceAll("<commit>", commitSha)
                  .replaceAll("{transcript_sha256}", transcriptsDigest).replaceAll("<transcript_sha256>", transcriptsDigest)
                  .replaceAll("{transcripts_sha256}", transcriptsDigest).replaceAll("<transcripts_sha256>", transcriptsDigest)
                  .replaceAll("{transcripts}", transcriptsDigest).replaceAll("<transcripts>", transcriptsDigest)
                  .replaceAll("{sha256}", transcriptsDigest).replaceAll("<sha256>", transcriptsDigest)
                  .replaceAll("{wallet}", walletSigner.address).replaceAll("<wallet>", walletSigner.address)
                  .replaceAll("{address}", walletSigner.address).replaceAll("<address>", walletSigner.address)
                  .replaceAll("{signer}", walletSigner.address).replaceAll("<signer>", walletSigner.address)
                  .replaceAll("{signed_at}", nowIso).replaceAll("<signed_at>", nowIso)
                  .replaceAll("{timestamp}", nowIso).replaceAll("<timestamp>", nowIso)
                  .replaceAll("{issued_at}", nowIso).replaceAll("<issued_at>", nowIso)
                  .replaceAll("{expires_at}", expiresIso).replaceAll("<expires_at>", expiresIso)
                  .replaceAll("{round}", "1").replaceAll("<round>", "1")
                  .replace(/\n+$/, "");

                const sigB58 = walletSigner.signUtf8(filledMsg);
                fd.append("entry_message", filledMsg);
                fd.append("entry_signature", sigB58);
              }

              const res = await fetch(submitUrl, {
                method: "POST",
                headers: {
                  "Accept": "application/json",
                  "x-api-key": apiKey
                },
                body: fd
              });
              const txt = await res.text();
              return { status: res.status, ok: res.ok, text: txt, filledMsg };
            }

            try {
              let attempt = await postSignedSubmission(expectedTranscriptsDigest);
              if (!attempt.ok && attempt.status === 422) {
                const m = attempt.text.match(/but this request submits ([0-9a-f]{64})/i);
                if (m && m[1] && m[1].toLowerCase() !== expectedTranscriptsDigest.toLowerCase()) {
                  attempt = await postSignedSubmission(m[1].toLowerCase());
                }
              }

              submitResultText += `HTTP ${attempt.status}:\n${attempt.text.slice(0, 1100)}`;
              if (!attempt.ok && attempt.filledMsg) {
                submitResultText += `\n\n📝 Signed message:\n${attempt.filledMsg}`;
              }
            } catch (err) {
              submitResultText += `Error koneksi submit: ${err.message}`;
            }
          }

          const headerTitle = mode === "fix"
            ? `🛠️ Auto-Fix & Resubmit: ${title} (${slug})`
            : mode === "retry_submit"
              ? `🔁 Retry Submit Repo: ${title} (${slug})`
              : `🚀 Autopilot Bounty: ${title} (${slug})`;

          const finalReport = [
            headerTitle,
            `📦 Repo GitHub: ${repoUrl}`,
            `🔖 Commit: ${commitSha.slice(0, 7)} | Wallet: ${walletSigner ? walletSigner.address.slice(0, 6) + "..." + walletSigner.address.slice(-4) : "none"}`,
            mode === "fix" ? `🩹 Error sebelumnya:\n${failedDetail.slice(0, 550)}` : "",
            cleanupSummary,
            buildWarning,
            "",
            "📤 Hasil Submit API make.fun:",
            submitResultText,
            "",
            `⛽ ${gas}`
          ].filter(Boolean).join("\n");

          await notify(finalReport);
          EOF
          node /tmp/build_and_submit.mjs

      - name: Backup Session Transcript Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-session-transcript
          path: /tmp/openclaw_session_backup.jsonl
          if-no-files-found: ignore
