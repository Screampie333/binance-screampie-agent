name: Binance Agent 24/7 Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-command]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install OpenClaw, make.fun Skill & Web3 Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g openclaw@latest

          mkdir -p "$HOME/.openclaw/workspace/skills/makefun"
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice groq-api-key \
            --groq-api-key "$GROQ_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          openclaw config set agents.defaults.models '{"google/gemini-3.1-flash-lite":{},"groq/llama-3.3-70b-versatile":{},"google/gemini-3.5-flash-lite":{}}' --strict-json --merge || true
          openclaw models set google/gemini-3.1-flash-lite || true
          openclaw models fallbacks add groq/llama-3.3-70b-versatile || true
          openclaw models fallbacks add google/gemini-3.5-flash-lite || true

          cp AGENTS.md "$HOME/.openclaw/workspace/AGENTS.md"
          cat <<EOF > "$HOME/.openclaw/.env"
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          MAKEFUN_API_KEY=${MAKEFUN_API_KEY}
          EOF
          chmod 600 "$HOME/.openclaw/.env"

          # Pasang skill resmi make.fun langsung dari make.fun/skill.md
          curl -fsSL "https://make.fun/skill.md" -o "$HOME/.openclaw/workspace/skills/makefun/SKILL.md"
          curl -fsSL "https://make.fun/heartbeat.md" -o "$HOME/.openclaw/workspace/skills/makefun/heartbeat.md" || true

          # Jika dijalankan manual (workflow_dispatch), kirim isi Step 1-8 skill.md ke Telegram
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STEPS_PART1=$(tail -n +25 "$HOME/.openclaw/workspace/skills/makefun/SKILL.md" | head -c 3500)
            STEPS_PART2=$(tail -n +25 "$HOME/.openclaw/workspace/skills/makefun/SKILL.md" | tail -c +3501 | head -c 3500)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=📘 MAKE.FUN SKILL (Part 1):
${STEPS_PART1}"
            if [ -n "$STEPS_PART2" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=📘 MAKE.FUN SKILL (Part 2):
${STEPS_PART2}"
            fi
          fi

          # Pasang Binance Web3 skills (audit & token info)
          cd "$HOME/.openclaw/workspace"
          npx -y skills add binance/binance-skills-hub/skills/binance-web3 --all --agent '*' -y
          for s in query-token-audit query-token-info; do
            cp -r "$HOME/.openclaw/workspace/.agents/skills/$s" "$HOME/.openclaw/workspace/skills/"
          done
          rm -rf "$HOME/.openclaw/workspace/.agents"

      - name: Fetch Live RPC Gas, make.fun Bounties & Discord Feed
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          GAS_REPORT=$(node -e '
            async function getGas(name, rpcUrl) {
              try {
                const res = await fetch(rpcUrl, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_gasPrice", params: [] })
                });
                const json = await res.json();
                const wei = BigInt(json.result || "0x0");
                const gwei = (Number(wei) / 1e9).toFixed(3);
                return `${name}: ${gwei} Gwei`;
              } catch {
                return `${name}: unavailable`;
              }
            }
            (async () => {
              const bsc = await getGas("BSC (Chain 56)", "https://bsc-dataseed.binance.org");
              const base = await getGas("Base (Chain 8453)", "https://mainnet.base.org");
              const eth = await getGas("Ethereum (Chain 1)", "https://eth.llamarpc.com");
              console.log([bsc, base, eth].join(" | "));
            })();
          ')
          echo "GAS_REPORT=${GAS_REPORT}" >> $GITHUB_ENV

          MAKEFUN_FEED=$(node -e '
            (async () => {
              try {
                const res = await fetch("https://make.fun/api/competitions?limit=200");
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data.competitions || data.items || data.data || []);
                const summary = list.slice(0, 15).map(item => {
                  const slug = item.slug || item.id || "";
                  const title = item.title || item.name || "Untitled";
                  const fee = item.entryFee ?? item.fee ?? item.price ?? 0;
                  const prize = item.prize ?? item.reward ?? "unknown";
                  const status = item.status || "open";
                  return `- [${slug}] ${title} | prize: ${prize} | fee: ${fee} | status: ${status}`;
                }).join("\n");
                console.log(summary || "Tidak ada data kompetisi make.fun.");
              } catch (e) {
                console.log("Gagal mengambil data make.fun API.");
              }
            })();
          ')
          echo "MAKEFUN_FEED<<EOF" >> $GITHUB_ENV
          echo "$MAKEFUN_FEED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ -n "$DISCORD_BOT_TOKEN" ] && [ -n "$DISCORD_CHANNEL_ID" ]; then
            ALL_MSGS=""
            IFS=',' read -ra CHANNELS <<< "$DISCORD_CHANNEL_ID"
            for CH_ID in "${CHANNELS[@]}"; do
              CH_ID=$(echo "$CH_ID" | xargs)
              [ -z "$CH_ID" ] && continue
              MSGS=$(curl -s -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
                "https://discord.com/api/v10/channels/${CH_ID}/messages?limit=5" | \
                node -e '
                  const fs = require("fs");
                  const chId = process.argv[1];
                  try {
                    const list = JSON.parse(fs.readFileSync(0, "utf8"));
                    if (Array.isArray(list)) {
                      console.log(list.map(m => `[Channel:${chId} | ${m.author?.username}]: ${m.content}`).join("\n"));
                    }
                  } catch {}
                ' "$CH_ID")
              ALL_MSGS="${ALL_MSGS}\n${MSGS}"
            done
            echo "DISCORD_FEED<<EOF" >> $GITHUB_ENV
            echo -e "$ALL_MSGS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Execute Agent Cycle & Notify Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          USER_CMD: ${{ github.event.client_payload.command }}
        run: |
          cd "$HOME/.openclaw/workspace"
          if [ -n "$USER_CMD" ]; then
            PROMPT="Perintah langsung dari user (${USER_CMD}). Gas saat ini: ${GAS_REPORT}. Daftar bounty make.fun terbaru:\n${MAKEFUN_FEED}\nGunakan skill makefun di skills/makefun/SKILL.md dan jawab dengan rapi, singkat, dan langsung ke inti (maksimal 1500 karakter)."
          else
            PROMPT="Gas saat ini: ${GAS_REPORT}.\n\nBounty make.fun terbaru:\n${MAKEFUN_FEED}\n\nPesan Discord terbaru:\n${DISCORD_FEED}\n\nIkuti aturan di AGENTS.md dan skills/makefun/SKILL.md. Saring bounty GRATIS ($0) di make.fun (cek prerequisites-nya), laporkan bounty berbayar atau yang butuh aksi manual (X/YouTube/Roblox) ke owner, dan saring peluang Free Mint on-chain yang aman (tolak link t.me / bot pihak ketiga / tawaran akses wallet). Tulis laporan rapi maksimal 1500 karakter."
          fi

          RAW_JSON=$(openclaw agent --local --json --message "$PROMPT" 2>/dev/null || true)
          CLEAN_MSG=$(node -e '
            const raw = process.argv[1] || "";
            const start = raw.indexOf("{");
            if (start === -1) process.exit(0);
            try {
              const data = JSON.parse(raw.slice(start));
              const text = data?.result?.payloads?.[0]?.text || data?.payloads?.[0]?.text || data?.text || "";
              console.log(text);
            } catch {}
          ' "$RAW_JSON")

          MSG="${CLEAN_MSG:-⛽ Gas Fee: ${GAS_REPORT}}"
          MSG="${MSG:0:3800}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
