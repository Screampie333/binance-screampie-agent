name: Binance Agent 24/7 Worker

on:
  schedule:
    # Jalan otomatis setiap 15 menit (24/7)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install baw CLI & OpenClaw
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g @binance/agentic-wallet@1.12.0 openclaw@latest
          baw --version
          openclaw --version

      - name: Restore Binance Wallet Session
        env:
          BAW_SESSION_B64: ${{ secrets.BAW_SESSION_B64 }}
        run: |
          echo "$BAW_SESSION_B64" | base64 -d > /tmp/baw.tar.gz
          tar -xzf /tmp/baw.tar.gz -C "$HOME"
          rm -f /tmp/baw.tar.gz
          chmod 700 "$HOME/.baw"
          baw wallet status --json

      - name: Setup OpenClaw & Binance Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p "$HOME/.openclaw/workspace"
          
          # Inisialisasi dasar
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice groq-api-key \
            --groq-api-key "$GROQ_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          # 1. Deteksi model aktif di akun Google AI Studio kamu (limit 250.000 TPM)
          GEMINI_JSON=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}")
          echo "Daftar model Gemini aktif:"
          echo "$GEMINI_JSON" | node -e '
            const d=JSON.parse(require("fs").readFileSync(0,"utf8"));
            const ids=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace("models/",""));
            console.log(ids.join(", "));
          '

          PRIMARY_GEMINI=$(echo "$GEMINI_JSON" | node -e '
            const d=JSON.parse(require("fs").readFileSync(0,"utf8"));
            const ids=(d.models||[])
              .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
              .map(m=>m.name.replace("models/",""))
              .filter(id=>id.includes("flash") && !id.includes("image") && !id.includes("tts") && !id.includes("thinking") && !id.includes("argon"));
            const preferred = ids.find(id=>id.includes("3.8-flash-lite")) || ids.find(id=>id.includes("flash-lite")) || ids.find(id=>id.includes("3.8-flash")) || ids[0];
            console.
