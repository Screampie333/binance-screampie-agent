name: Binance Agent 24/7 Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-command]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git & GitHub Auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Screampie333"
          git config --global user.email "screampie333@users.noreply.github.com"
          git config --global init.defaultBranch main
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install OpenClaw, make.fun Skill & Web3 Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g openclaw@latest

          mkdir -p "$HOME/.openclaw/workspace"
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice gemini-api-key \
            --gemini-api-key "$GEMINI_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          openclaw config set tools.profile full || true
          openclaw config set agents.defaults.models '{"google/gemini-2.5-flash":{},"google/gemini-3.1-flash-lite":{},"groq/llama-3.3-70b-versatile":{}}' --strict-json --merge || true
          openclaw models set google/gemini-2.5-flash || true
          openclaw models fallbacks add google/gemini-3.1-flash-lite || true
          openclaw models fallbacks add groq/llama-3.3-70b-versatile || true

          cp AGENTS.md "$HOME/.openclaw/workspace/AGENTS.md"
          printf "GEMINI_API_KEY=%s\nGOOGLE_API_KEY=%s\nGROQ_API_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nMAKEFUN_API_KEY=%s\n" \
            "$GEMINI_API_KEY" "$GEMINI_API_KEY" "$GROQ_API_KEY" "$TELEGRAM_BOT_TOKEN" "$MAKEFUN_API_KEY" > "$HOME/.openclaw/.env"
          chmod 600 "$HOME/.openclaw/.env"

          cd "$HOME/.openclaw/workspace"
          npx -y skills add binance/binance-skills-hub/skills/binance-web3 --all --agent '*' -y
          rm -rf "$HOME/.openclaw/workspace/skills"
          mkdir -p "$HOME/.openclaw/workspace/skills/makefun"
          for s in query-token-audit query-token-info; do
            cp -r "$HOME/.openclaw/workspace/.agents/skills/$s" "$HOME/.openclaw/workspace/skills/"
          done
          rm -rf "$HOME/.openclaw/workspace/.agents"

          curl -fsSL "https://make.fun/skill.md" -o "$HOME/.openclaw/workspace/skills/makefun/SKILL.md"
          curl -fsSL "https://make.fun/heartbeat.md" -o "$HOME/.openclaw/workspace/skills/makefun/heartbeat.md" || true

      - name: Select Target Free Bounty & Fetch Gas RPC
        env:
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/select_bounty.mjs
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const envFile = process.env.GITHUB_ENV;
          function setEnv(name, value) {
            const delim = `EOF_${name}_${Date.now()}`;
            fs.appendFileSync(envFile, `${name}<<${delim}\n${value}\n${delim}\n`);
          }

          async function getGas(name, rpcUrl) {
            try {
              const res = await fetch(rpcUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_gasPrice", params: [] })
              });
              const json = await res.json();
              const wei = BigInt(json.result || "0x0");
              const gwei = (Number(wei) / 1e9).toFixed(3);
              return `${name}: ${gwei} Gwei`;
            } catch {
              return `${name}: unavailable`;
            }
          }

          const gasList = await Promise.all([
            getGas("BSC (Chain 56)", "https://bsc-dataseed.binance.org"),
            getGas("Base (Chain 8453)", "https://mainnet.base.org"),
            getGas("Ethereum (Chain 1)", "https://eth.llamarpc.com")
          ]);
          setEnv("GAS_REPORT", gasList.join(" | "));

          let existingNames = [];
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync("gh", ["repo", "list", "Screampie333", "--limit", "100", "--json", "name"], { encoding: "utf8", timeout: 30000 });
              existingNames = JSON.parse(out || "[]").map(r => r.name.toLowerCase());
            }
          } catch {}

          const headers = { Accept: "application/json" };
          if (process.env.MAKEFUN_API_KEY) headers["x-api-key"] = process.env.MAKEFUN_API_KEY;

          let targetSlug = "";
          let targetTitle = "";
          try {
            const res = await fetch("https://make.fun/api/competitions?limit=200", { headers });
            const data = await res.json();
            const list = Array.isArray(data) ? data : (data.competitions || data.items || data.data || []);
            const candidates = list.filter(item => {
              const slug = String(item.slug || item.id || "").toLowerCase();
              const fee = Number(item.entryFee ?? item.fee ?? item.price ?? 0);
              const status = String(item.status || "open").toLowerCase();
              const alreadyBuilt = existingNames.some(n => n === `makefun-${slug}` || n.includes(slug));
              return slug && fee === 0 && (status === "open" || status === "active") && !alreadyBuilt;
            });

            for (const c of candidates) {
              const slug = c.slug || c.id;
              try {
                const reqRes = await fetch(`https://make.fun/api/competitions/${slug}/requirements`, { headers });
                if (reqRes.ok) {
                  const reqJson = await reqRes.json();
                  const prereqs = Array.isArray(reqJson) ? reqJson : (reqJson.prerequisites || []);
                  const hasHumanStep = prereqs.some(p => p.required !== false);
                  if (hasHumanStep) continue;
                }
              } catch {}
              targetSlug = slug;
              targetTitle = c.title || c.name || slug;
              break;
            }
          } catch {}

          setEnv("TARGET_SLUG", targetSlug);
          setEnv("TARGET_TITLE", targetTitle);
          EOF
          node /tmp/select_bounty.mjs

      - name: Build Code in OpenClaw Session, Push Repo & Submit via OpenAPI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/build_and_submit.mjs
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          const home = os.homedir();
          const workspace = path.join(home, ".openclaw", "workspace");
          const env = {
            ...process.env,
            PATH: `${path.join(home, ".npm-global", "bin")}:${process.env.PATH || ""}`
          };

          const slug = (process.env.TARGET_SLUG || "").trim();
          const title = (process.env.TARGET_TITLE || slug).trim();
          const gas = process.env.GAS_REPORT || "";
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;
          const apiKey = process.env.MAKEFUN_API_KEY || "";

          async function notify(text) {
            await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: chatId, text: text.slice(0, 3900) })
            });
          }

          if (!slug) {
            await notify(`ℹ️ Tidak ada bounty gratis ($0) baru tanpa human-only steps saat ini.\n\n⛽ ${gas}`);
            process.exit(0);
          }

          // 1. Parse seluruh POST route & schema dari /api/openapi.json + SKILL.md
          const skillMd = fs.readFileSync(path.join(workspace, "skills", "makefun", "SKILL.md"), "utf8");
          let allPostRoutes = [];
          try {
            const oaRes = await fetch("https://make.fun/api/openapi.json", { headers: { Accept: "application/json" } });
            if (oaRes.ok) {
              const oa = await oaRes.json();
              function resolveRef(node, depth = 0) {
                if (!node || typeof node !== "object" || depth > 5) return node;
                if (node.$ref && typeof node.$ref === "string" && node.$ref.startsWith("#/")) {
                  const parts = node.$ref.slice(2).split("/");
                  let target = oa;
                  for (const part of parts) target = target?.[part];
                  return resolveRef(target, depth + 1);
                }
                if (Array.isArray(node)) return node.map(item => resolveRef(item, depth + 1));
                const out = {};
                for (const [k, v] of Object.entries(node)) {
                  if (k === "description" || k === "example") continue;
                  out[k] = resolveRef(v, depth + 1);
                }
                return out;
              }

              for (const [routePath, methods] of Object.entries(oa.paths || {})) {
                if (methods?.post) {
                  const resolvedBody = resolveRef(methods.post.requestBody?.content?.["application/json"]?.schema || {});
                  allPostRoutes.push({
                    path: routePath,
                    summary: methods.post.summary || "",
                    bodySchema: resolvedBody
                  });
                }
              }
            }
          } catch {}

          const extractionPrompt = [
            `Analyze make.fun's OpenAPI POST routes and SKILL.md below for competition slug "${slug}".`,
            "Determine:",
            "1) \"preBuildSteps\": array of HTTP POST steps needed BEFORE creating/submitting the repo (for example registering/entering the competition if required by SKILL.md; otherwise []).",
            "2) \"submitSteps\": array of HTTP POST steps needed to submit the repository, commit SHA, and AI session transcript.",
            "Each step object in both arrays MUST have:",
            "- \"url\": exact full URL starting with https://make.fun/api/... (replace path params like {slug} or {competitionSlug} with \"" + slug + "\", or {id}/{entryId} with \"__PREV_ID__\")",
            "- \"method\": \"POST\"",
            "- \"bodyTemplate\": JSON object matching the exact property names in bodySchema, using placeholders \"__REPO_URL__\", \"__COMMIT_SHA__\", \"__SLUG__\", \"__PREV_ID__\", \"__TRANSCRIPT_ARRAY__\", \"__TRANSCRIPT_STRING__\", \"__TRANSCRIPT_FILES__\".",
            "Return ONLY valid JSON with keys \"preBuildSteps\" and \"submitSteps\".",
            "",
            "ALL OPENAPI POST ROUTES:",
            JSON.stringify(allPostRoutes).slice(0, 16000),
            "",
            "SKILL.MD:",
            skillMd.slice(0, 14000)
          ].join("\n");

          let apiPlan = { preBuildSteps: [], submitSteps: [] };
          try {
            const gRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: extractionPrompt }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });
            if (gRes.ok) {
              const gData = await gRes.json();
              const parsed = JSON.parse(gData?.candidates?.[0]?.content?.parts?.[0]?.text || "{}");
              if (parsed.submitSteps?.length) apiPlan = parsed;
            }
          } catch {}

          if (!apiPlan.submitSteps?.length && process.env.GROQ_API_KEY) {
            try {
              const groqRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.GROQ_API_KEY}`
                },
                body: JSON.stringify({
                  model: "llama-3.3-70b-versatile",
                  response_format: { type: "json_object" },
                  messages: [{ role: "user", content: extractionPrompt }]
                })
              });
              if (groqRes.ok) {
                const grData = await groqRes.json();
                const parsed = JSON.parse(grData?.choices?.[0]?.message?.content || "{}");
                if (parsed.submitSteps?.length) apiPlan = parsed;
              }
            } catch {}
          }

          function injectValues(obj, vars) {
            if (typeof obj === "string") {
              if (obj === "__TRANSCRIPT_ARRAY__") return vars.transcriptLines;
              if (obj === "__TRANSCRIPT_STRING__") return vars.transcriptRaw;
              if (obj === "__TRANSCRIPT_FILES__") return [{ name: "session.jsonl", content: vars.transcriptRaw }];
              return obj
                .replaceAll("__REPO_URL__", vars.repoUrl || "")
                .replaceAll("__COMMIT_SHA__", vars.commitSha || "")
                .replaceAll("__SLUG__", slug)
                .replaceAll("__PREV_ID__", vars.prevId || "");
            }
            if (Array.isArray(obj)) return obj.map(v => injectValues(v, vars));
            if (obj && typeof obj === "object") {
              const out = {};
              for (const [k, v] of Object.entries(obj)) out[k] = injectValues(v, vars);
              return out;
            }
            return obj;
          }

          const stepLogs = [];
          let lastId = "";

          for (const st of (apiPlan.preBuildSteps || [])) {
            const targetUrl = String(st.url || "").replaceAll("__PREV_ID__", lastId);
            const payload = injectValues(st.bodyTemplate || {}, { prevId: lastId });
            try {
              const res = await fetch(targetUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json", "x-api-key": apiKey },
                body: JSON.stringify(payload)
              });
              const txt = await res.text();
              try {
                const parsedRes = JSON.parse(txt);
                lastId = parsedRes?.id || parsedRes?.entry?.id || parsedRes?.submission?.id || parsedRes?.data?.id || lastId;
              } catch {}
              stepLogs.push(`Pre-step HTTP ${res.status} (${targetUrl}): ${txt.slice(0, 300)}`);
            } catch (err) {
              stepLogs.push(`Pre-step Error (${targetUrl}): ${err.message}`);
            }
          }

          // 2. Jalankan OpenClaw dengan batas waktu ketat (maks 6 menit) agar tidak pernah di-cancel GitHub Actions
          const workDir = `/tmp/work-${slug}`;
          fs.mkdirSync(workDir, { recursive: true });
          const sessionId = `makefun-${slug}-${Date.now()}`;

          const buildPrompt = [
            `Tugasmu membangun proyek untuk bounty make.fun slug: "${slug}" (${title}) di direktori "${workDir}".`,
            "PENTING: Jangan jalankan simulasi/benchmark yang lambat (semua test wajib selesai di bawah 10 detik). JANGAN jalankan gh repo create dan JANGAN kirim submit API.",
            "Selesaikan dalam 6 putaran tool call singkat:",
            `1) Fetch detail/kit bounty "${slug}" dari https://make.fun/api/competitions/${slug} dan ekstrak ke "${workDir}".`,
            `2) Baca RULES.txt di "${workDir}" dan quote baris anchor di output tool pertama.`,
            `3) Tulis file kode utama di "${workDir}".`,
            `4) Tulis file test singkat di "${workDir}".`,
            `5) Tulis README.md di "${workDir}" sesuai RULES.txt.`,
            `6) Jalankan verifikasi cepat (<10 detik) lalu akhiri sesi dengan ringkasan singkat.`
          ].join("\n");

          let rawOpenclawOutput = "";
          let buildWarning = "";
          try {
            rawOpenclawOutput = execFileSync(
              "openclaw",
              ["agent", "--local", "--session-id", sessionId, "--timeout", "300", "--json", "--message", buildPrompt],
              {
                cwd: workspace,
                env,
                encoding: "utf8",
                timeout: 360000,
                killSignal: "SIGKILL",
                maxBuffer: 25 * 1024 * 1024
              }
            );
          } catch (err) {
            rawOpenclawOutput = (err.stdout || "").toString();
            buildWarning = `⚠️ Catatan build (timeout/exit): ${(err.message || "").slice(0, 200)}`;
          }

          const files = fs.readdirSync(workDir).filter(f => !f.startsWith("."));
          if (files.length === 0) {
            await notify(`⚠️ Direktori ${workDir} kosong setelah OpenClaw selesai.\n${buildWarning}\n\n⛽ ${gas}`);
            process.exit(1);
          }

          // 3. Push ke repo publik GitHub dengan topic makefun
          const repoFull = `Screampie333/makefun-${slug}`;
          const repoUrl = `https://github.com/${repoFull}`;
          let commitSha = "";
          try {
            fs.writeFileSync(path.join(workDir, ".gitignore"), "__pycache__/\n*.pyc\nnode_modules/\n.env\n");
            execFileSync("git", ["init"], { cwd: workDir, env, timeout: 30000 });
            execFileSync("git", ["add", "-A"], { cwd: workDir, env, timeout: 30000 });
            execFileSync("git", ["commit", "-m", `Initial entry for ${slug}`], { cwd: workDir, env, timeout: 30000 });
            commitSha = execFileSync("git", ["rev-parse", "HEAD"], { cwd: workDir, env, encoding: "utf8", timeout: 30000 }).trim();

            let repoExists = false;
            try {
              execFileSync("gh", ["repo", "view", repoFull], { cwd: workDir, env, stdio: "ignore", timeout: 30000 });
              repoExists = true;
            } catch {}

            if (repoExists) {
              try { execFileSync("git", ["remote", "remove", "origin"], { cwd: workDir, env, stdio: "ignore", timeout: 15000 }); } catch {}
              execFileSync("git", ["remote", "add", "origin", `${repoUrl}.git`], { cwd: workDir, env, timeout: 30000 });
              execFileSync("git", ["push", "-u", "origin", "main", "--force"], { cwd: workDir, env, timeout: 60000 });
            } else {
              execFileSync("gh", ["repo", "create", repoFull, "--public", "--source=.", "--remote=origin", "--push"], { cwd: workDir, env, timeout: 60000 });
            }
            execFileSync("gh", ["repo", "edit", repoFull, "--add-topic", "makefun"], { cwd: workDir, env, timeout: 30000 });
          } catch (err) {
            await notify(`⚠️ Kode selesai dibuat, tapi gagal push ke GitHub (${repoFull}):\n${(err.message || "").slice(0, 600)}`);
            process.exit(1);
          }

          // 4. Kumpulkan transkrip sesi OpenClaw (.jsonl dari disk atau blok JSON bersih di stdout)
          function findJsonlFiles(dir, results = []) {
            if (!fs.existsSync(dir)) return results;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) findJsonlFiles(fullPath, results);
              else if (entry.name.endsWith(".jsonl")) {
                results.push({ fullPath, size: fs.statSync(fullPath).size });
              }
            }
            return results;
          }

          const allJsonl = findJsonlFiles(path.join(home, ".openclaw")).sort((a, b) => b.size - a.size);
          let transcriptRaw = "";
          let transcriptLines = [];

          if (allJsonl.length > 0 && allJsonl[0].size > 0) {
            transcriptRaw = fs.readFileSync(allJsonl[0].fullPath, "utf8");
            transcriptLines = transcriptRaw.split("\n").filter(Boolean).map(line => {
              try { return JSON.parse(line); } catch { return { raw: line }; }
            });
          } else {
            const jsonStart = rawOpenclawOutput.indexOf("{");
            const jsonEnd = rawOpenclawOutput.lastIndexOf("}");
            if (jsonStart !== -1 && jsonEnd > jsonStart) {
              try {
                const parsedOut = JSON.parse(rawOpenclawOutput.slice(jsonStart, jsonEnd + 1));
                const events = [];
                const nowIso = new Date().toISOString();
                events.push({ type: "session_start", sessionId, timestamp: nowIso, model: "google/gemini-2.5-flash", workDir });
                const payloads = parsedOut?.result?.payloads || parsedOut?.payloads || [];
                const messages = parsedOut?.result?.messages || parsedOut?.messages || [];
                if (Array.isArray(messages) && messages.length > 0) {
                  for (const m of messages) events.push({ timestamp: nowIso, ...m });
                } else {
                  for (const p of payloads) events.push({ type: "assistant", timestamp: nowIso, ...p });
                }
                if (parsedOut?.result?.usage || parsedOut?.usage) {
                  events.push({ type: "usage", timestamp: nowIso, usage: parsedOut?.result?.usage || parsedOut?.usage });
                }
                transcriptLines = events;
                transcriptRaw = events.map(e => JSON.stringify(e)).join("\n");
              } catch {}
            }
          }

          if (transcriptRaw) {
            fs.writeFileSync("/tmp/openclaw_session_backup.jsonl", transcriptRaw);
          }

          // 5. Kirim submission menggunakan route & schema hasil ekstraksi OpenAPI
          let anySubmitOk = false;
          const submitSteps = apiPlan.submitSteps || [];
          for (const st of submitSteps) {
            const targetUrl = String(st.url || "").replaceAll("__PREV_ID__", lastId);
            const payload = injectValues(st.bodyTemplate || {}, {
              repoUrl,
              commitSha,
              prevId: lastId,
              transcriptLines,
              transcriptRaw
            });
            try {
              const res = await fetch(targetUrl, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "x-api-key": apiKey
                },
                body: JSON.stringify(payload)
              });
              const txt = await res.text();
              if (res.ok) anySubmitOk = true;
              try {
                const parsedRes = JSON.parse(txt);
                lastId = parsedRes?.id || parsedRes?.entry?.id || parsedRes?.submission?.id || parsedRes?.data?.id || lastId;
              } catch {}
              stepLogs.push(`HTTP ${res.status} (${targetUrl}):\n${txt.slice(0, 700)}`);
            } catch (err) {
              stepLogs.push(`Error (${targetUrl}): ${err.message}`);
            }
          }

          const availableRoutesNote = (!anySubmitOk && allPostRoutes.length > 0)
            ? `\n\n📌 Daftar POST routes resmi di /api/openapi.json:\n${allPostRoutes.map(r => `- ${r.path}`).join("\n")}`
            : "";

          const finalReport = [
            `🚀 Autopilot Bounty: ${title} (${slug})`,
            `📦 Repo GitHub: ${repoUrl}`,
            `🔖 Commit: ${commitSha.slice(0, 7)} | Transcript lines: ${transcriptLines.length}`,
            buildWarning,
            "",
            "📤 Hasil Submit API make.fun:",
            (stepLogs.join("\n\n") || "Tidak ada step submit yang dieksekusi.") + availableRoutesNote,
            "",
            `⛽ ${gas}`
          ].filter(Boolean).join("\n");

          await notify(finalReport);
          EOF
          node /tmp/build_and_submit.mjs

      - name: Backup Session Transcript Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-session-transcript
          path: /tmp/openclaw_session_backup.jsonl
          if-no-files-found: ignore
