name: Binance Agent 24/7 Worker

on:
  workflow_dispatch:

jobs:
  pair-makefun-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install makefun CLI
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g makefun || npm install -g @makefun/cli || true

      - name: Run makefun login & Send Approval Link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat <<'EOF' > /tmp/hook.js
          const fs = require('fs');
          const cp = require('child_process');
          const origSpawn = cp.spawn;
          cp.spawn = function(cmd, args, opts) {
            const all = [cmd, ...(args || [])].join(' ');
            const match = all.match(/https?:\/\/[^\s'"]+/);
            if (match) fs.writeFileSync('/tmp/captured_url.txt', match[0]);
            return origSpawn.apply(this, arguments);
          };
          EOF

          CMD_BIN=$(command -v makefun || echo "npx -y makefun")
          NODE_OPTIONS="--require /tmp/hook.js" script -q -f -c "$CMD_BIN login" /tmp/makefun_login.log > /dev/null 2>&1 &
          LOGIN_PID=$!

          for i in $(seq 1 25); do
            if grep -qiE "http|code|approve|pair" /tmp/makefun_login.log 2>/dev/null || [ -s /tmp/captured_url.txt ]; then
              sleep 2
              break
            fi
            sleep 1
          done

          CAPTURED_URL=$(cat /tmp/captured_url.txt 2>/dev/null | tr -d '[:space:]')
          CLEAN_LOG=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/makefun_login.log | tr -cd '\11\12\15\40-\176' | head -c 3000)
          MSG_PAIR=$(printf "🔗 APPROVE MAKE.FUN AGENT:\n%s\n\nLog CLI:\n%s" "$CAPTURED_URL" "$CLEAN_LOG")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG_PAIR}"

          wait $LOGIN_PID || true
          sleep 2

          DIRS=""
          [ -d "$HOME/.makefun" ] && DIRS="$DIRS .makefun"
          [ -d "$HOME/.config/makefun" ] && DIRS="$DIRS .config/makefun"
          [ -d "$HOME/.local/share/makefun" ] && DIRS="$DIRS .local/share/makefun"

          if [ -z "$DIRS" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Folder sesi makefun belum terbentuk. Pastikan approval sudah diklik sebelum timeout."
            exit 1
          fi

          tar -czf /tmp/makefun_session.tar.gz -C "$HOME" $DIRS
          B64_STR=$(base64 -w 0 /tmp/makefun_session.tar.gz)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ COPY STRING BASE64 DI BAWAH INI KE SECRET MAKEFUN_SESSION_B64:"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${B64_STR}"
