name: Binance Agent 24/7 Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [telegram-command]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Git & GitHub Auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "Screampie333"
          git config --global user.email "screampie333@users.noreply.github.com"
          git config --global init.defaultBranch main
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install OpenClaw, make.fun Skill & Web3 Skills
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          npm install -g openclaw@latest

          mkdir -p "$HOME/.openclaw/workspace"
          openclaw onboard --non-interactive --accept-risk \
            --auth-choice gemini-api-key \
            --gemini-api-key "$GEMINI_API_KEY" \
            --skip-channels --skip-skills --skip-daemon || true

          openclaw config set tools.profile full || true
          openclaw config set agents.defaults.models '{"google/gemini-2.5-flash":{},"google/gemini-3.1-flash-lite":{},"groq/llama-3.3-70b-versatile":{}}' --strict-json --merge || true
          openclaw models set google/gemini-2.5-flash || true
          openclaw models fallbacks add google/gemini-3.1-flash-lite || true
          openclaw models fallbacks add groq/llama-3.3-70b-versatile || true

          cp AGENTS.md "$HOME/.openclaw/workspace/AGENTS.md"
          printf "GEMINI_API_KEY=%s\nGOOGLE_API_KEY=%s\nGROQ_API_KEY=%s\nTELEGRAM_BOT_TOKEN=%s\nMAKEFUN_API_KEY=%s\n" \
            "$GEMINI_API_KEY" "$GEMINI_API_KEY" "$GROQ_API_KEY" "$TELEGRAM_BOT_TOKEN" "$MAKEFUN_API_KEY" > "$HOME/.openclaw/.env"
          chmod 600 "$HOME/.openclaw/.env"

          cd "$HOME/.openclaw/workspace"
          npx -y skills add binance/binance-skills-hub/skills/binance-web3 --all --agent '*' -y
          rm -rf "$HOME/.openclaw/workspace/skills"
          mkdir -p "$HOME/.openclaw/workspace/skills/makefun"
          for s in query-token-audit query-token-info; do
            cp -r "$HOME/.openclaw/workspace/.agents/skills/$s" "$HOME/.openclaw/workspace/skills/"
          done
          rm -rf "$HOME/.openclaw/workspace/.agents"

          curl -fsSL "https://make.fun/skill.md" -o "$HOME/.openclaw/workspace/skills/makefun/SKILL.md"
          curl -fsSL "https://make.fun/heartbeat.md" -o "$HOME/.openclaw/workspace/skills/makefun/heartbeat.md" || true

      - name: Fetch Free Bounties, Existing Repos & Gas RPC
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cat <<'EOF' > /tmp/fetch_feeds.mjs
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const envFile = process.env.GITHUB_ENV;
          function setEnv(name, value) {
            const delim = `EOF_${name}_${Date.now()}`;
            fs.appendFileSync(envFile, `${name}<<${delim}\n${value}\n${delim}\n`);
          }

          async function getGas(name, rpcUrl) {
            try {
              const res = await fetch(rpcUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_gasPrice", params: [] })
              });
              const json = await res.json();
              const wei = BigInt(json.result || "0x0");
              const gwei = (Number(wei) / 1e9).toFixed(3);
              return `${name}: ${gwei} Gwei`;
            } catch {
              return `${name}: unavailable`;
            }
          }

          const gasList = await Promise.all([
            getGas("BSC (Chain 56)", "https://bsc-dataseed.binance.org"),
            getGas("Base (Chain 8453)", "https://mainnet.base.org"),
            getGas("Ethereum (Chain 1)", "https://eth.llamarpc.com")
          ]);
          setEnv("GAS_REPORT", gasList.join(" | "));

          try {
            const headers = { Accept: "application/json" };
            if (process.env.MAKEFUN_API_KEY) headers["x-api-key"] = process.env.MAKEFUN_API_KEY;
            const res = await fetch("https://make.fun/api/competitions?limit=200", { headers });
            const data = await res.json();
            const list = Array.isArray(data) ? data : (data.competitions || data.items || data.data || []);
            const freeOpen = list.filter(item => {
              const fee = Number(item.entryFee ?? item.fee ?? item.price ?? 0);
              const status = String(item.status || "open").toLowerCase();
              return fee === 0 && (status === "open" || status === "active");
            });
            const summary = freeOpen.slice(0, 25).map(item => {
              const slug = item.slug || item.id || "";
              const title = item.title || item.name || "Untitled";
              const prize = item.prize ?? item.reward ?? "unknown";
              return `- [${slug}] ${title} | prize: ${prize} | fee: $0 | status: open`;
            }).join("\n");
            setEnv("MAKEFUN_FEED", summary || "Tidak ada free bounty ($0) yang open saat ini.");
          } catch {
            setEnv("MAKEFUN_FEED", "Gagal mengambil data make.fun API.");
          }

          let existingRepos = "Belum ada repo makefun.";
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync("gh", ["repo", "list", "Screampie333", "--topic", "makefun", "--limit", "100", "--json", "name,url,pushedAt"], { encoding: "utf8" });
              existingRepos = out.trim() || existingRepos;
            }
          } catch {}
          setEnv("EXISTING_REPOS", existingRepos);

          const dcToken = process.env.DISCORD_BOT_TOKEN || "";
          const dcChannels = (process.env.DISCORD_CHANNEL_ID || "").split(",").map(s => s.trim()).filter(Boolean);
          if (dcToken && dcChannels.length > 0) {
            const allMsgs = [];
            for (const chId of dcChannels) {
              try {
                const res = await fetch(`https://discord.com/api/v10/channels/${chId}/messages?limit=5`, {
                  headers: { Authorization: `Bot ${dcToken}` }
                });
                const list = await res.json();
                if (Array.isArray(list)) {
                  allMsgs.push(...list.map(m => `[Channel:${chId} | ${m.author?.username}]: ${m.content}`));
                }
              } catch {}
            }
            setEnv("DISCORD_FEED", allMsgs.join("\n"));
          } else {
            setEnv("DISCORD_FEED", "");
          }
          EOF
          node /tmp/fetch_feeds.mjs

      - name: Execute Full Autopilot Builder & Submit to make.fun
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKEFUN_API_KEY: ${{ secrets.MAKEFUN_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          USER_CMD: ${{ github.event.client_payload.command }}
        run: |
          cat <<'EOF' > /tmp/run_agent.mjs
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          const home = os.homedir();
          const workspace = path.join(home, ".openclaw", "workspace");
          const env = {
            ...process.env,
            PATH: `${path.join(home, ".npm-global", "bin")}:${process.env.PATH || ""}`
          };

          const cmd = process.env.USER_CMD || "";
          const gas = process.env.GAS_REPORT || "";
          const mf = process.env.MAKEFUN_FEED || "";
          const repos = process.env.EXISTING_REPOS || "";
          const dc = process.env.DISCORD_FEED || "";

          function runOpenclaw(message) {
            const raw = execFileSync("openclaw", ["agent", "--local", "--json", "--message", message], {
              cwd: workspace,
              env,
              encoding: "utf8",
              maxBuffer: 20 * 1024 * 1024
            });
            const start = raw.indexOf("{");
            if (start === -1) return "";
            const data = JSON.parse(raw.slice(start));
            return data?.result?.payloads?.[0]?.text || data?.payloads?.[0]?.text || data?.text || "";
          }

          const baseContext = [
            `Gas saat ini: ${gas}`,
            "Repo makefun yang sudah ada di akun Screampie333 (lewati semua slug yang sudah ada di sini):",
            repos,
            "",
            "Kandidat bounty GRATIS ($0) berstatus open di make.fun:",
            mf,
            "",
            "Feed Discord terbaru:",
            dc
          ].join("\n");

          const prompt = cmd
            ? [
                `Perintah langsung dari owner: "${cmd}".`,
                baseContext,
                "Jalankan sesuai AGENTS.md dan skills/makefun/SKILL.md sampai benar-benar ter-submit ke API make.fun dan menampilkan submissionId asli. Tulis laporan ringkas maksimal 1600 karakter."
              ].join("\n")
            : [
                "MODE FULL AUTOPILOT AKTIF. Tugasmu BELUM selesai sebelum memanggil endpoint POST submit di API make.fun dan mendapatkan submissionId asli.",
                baseContext,
                "Instruksi wajib (lakukan secara bertahap minimal 8 putaran tool call):",
                "1) Baca seluruh isi skills/makefun/SKILL.md sampai habis (terutama endpoint & payload POST submission).",
                "2) Pilih 1 bounty GRATIS ($0) berstatus open yang belum ada di daftar repo Screampie333 dan cek GET https://make.fun/api/competitions/<slug>/requirements.",
                "3) Unduh kit bounty ke /tmp/work-<slug>, baca RULES.txt, dan quote baris anchor di output tool pertama sebelum menulis file apa pun.",
                "4) Tulis kode proyek secara bertahap dalam beberapa turn terpisah (kode utama, test/modul, README.md) menggunakan tool tulis file di sesi ini (>=30% authored lines).",
                "5) Jalankan script check dari kit hingga lulus 100%.",
                "6) Inisialisasi git, commit semua file, buat repo publik baru (gh repo create Screampie333/makefun-<slug> --public --source=. --remote=origin --push), dan tambah topic makefun (gh repo edit Screampie333/makefun-<slug> --add-topic makefun).",
                "7) WAJIB EKSEKUSI SUBMIT API: Ambil file .jsonl asli terbaru dari ~/.openclaw/agents/main/sessions/ (DILARANG mengedit/membuat manual), bundel sesuai instruksi di skills/makefun/SKILL.md, jalankan request POST submission ke https://make.fun/api/... dengan header x-api-key: $MAKEFUN_API_KEY, lalu poll status submission tersebut.",
                "8) Laporkan URL repo GitHub, submissionId asli, dan status submission dari server make.fun (maksimal 1500 karakter)."
              ].join("\n");

          let cleanMsg = "";
          try {
            cleanMsg = runOpenclaw(prompt);
          } catch (err) {
            cleanMsg = `⚠️ Siklus autopilot berhenti dengan error: ${(err.message || "").slice(0, 400)}`;
          }

          // Lapis ke-2: Jika repo baru ter-push tapi laporan belum memuat submissionId/bukti submit API make.fun, paksa selesaikan tahap submit sekarang selagi file .jsonl sesi masih ada di runner
          let currentRepos = [];
          try {
            if (process.env.GH_TOKEN) {
              const out = execFileSync("gh", ["repo", "list", "Screampie333", "--topic", "makefun", "--limit", "10", "--json", "name,url,pushedAt"], { encoding: "utf8" });
              currentRepos = JSON.parse(out || "[]");
            }
          } catch {}

          const hasNewPush = currentRepos.some(r => r.pushedAt && !repos.includes(r.name));
          const hasSubmitProof = /submission|submitted|preparing|scoring|scored/i.test(cleanMsg) && /[0-9a-f]{8}-[0-9a-f]{4}/i.test(cleanMsg);

          if (hasNewPush && !hasSubmitProof) {
            try {
              const latestRepo = currentRepos.find(r => r.pushedAt && !repos.includes(r.name));
              const followupPrompt = [
                `Repo ${latestRepo.url} sudah berhasil di-push ke GitHub, tetapi kamu BELUM mengirimkan submission ke API make.fun!`,
                "Baca bagian submit di skills/makefun/SKILL.md sekarang, ambil file .jsonl asli terbaru dari ~/.openclaw/agents/main/sessions/, kirim POST request submission untuk repo tersebut ke API make.fun menggunakan header x-api-key: $MAKEFUN_API_KEY, poll statusnya, dan laporkan respons JSON asli (submissionId & status)."
              ].join("\n");
              const submitMsg = runOpenclaw(followupPrompt);
              if (submitMsg) cleanMsg = `${cleanMsg}\n\n📤 Hasil Submit API make.fun:\n${submitMsg}`;
            } catch (err) {
              cleanMsg = `${cleanMsg}\n\n⚠️ Gagal auto-submit lanjutan: ${(err.message || "").slice(0, 300)}`;
            }
          }

          // Cek status submission langsung dari endpoint akun make.fun jika tersedia
          let makefunAccountCheck = "";
          try {
            if (process.env.MAKEFUN_API_KEY) {
              const res = await fetch("https://make.fun/api/submissions", {
                headers: { Accept: "application/json", "x-api-key": process.env.MAKEFUN_API_KEY }
              });
              if (res.ok) {
                const subData = await res.json();
                const items = Array.isArray(subData) ? subData : (subData.submissions || subData.items || subData.data || []);
                if (items.length > 0) {
                  makefunAccountCheck = items.slice(0, 3).map(s => `- [${s.competitionSlug || s.slug || s.id}] status: ${s.status}`).join("\n");
                }
              }
            }
          } catch {}

          let auditSummary = "Belum ada repo baru dengan topic makefun.";
          if (currentRepos.length > 0) {
            auditSummary = currentRepos.map(r => `- ${r.name}: ${r.pushedAt ? `✅ Ter-push (${r.pushedAt})` : "❌ KOSONG"}`).join("\n");
          }

          const finalReport = [
            cleanMsg || "⚠️ Tidak ada output teks dari agent.",
            "",
            "🔍 Audit Repo GitHub (Asli):",
            auditSummary,
            makefunAccountCheck ? `\n📋 Audit Submission make.fun (Asli):\n${makefunAccountCheck}` : "",
            "",
            `⛽ ${gas}`
          ].filter(Boolean).join("\n").slice(0, 3800);

          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;

          await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: chatId, text: finalReport })
          });
          EOF
          node /tmp/run_agent.mjs
