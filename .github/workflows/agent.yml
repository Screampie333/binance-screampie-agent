name: Binance Agent 24/7 Worker

on:
  workflow_dispatch:

jobs:
  pair-makefun-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Locate & Install makefun CLI
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p "$HOME/.npm-global/bin"
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$PATH"
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # 1. Cek installer resmi dari make.fun jika tersedia
          INSTALL_SH=$(curl -fsSL "https://make.fun/install.sh" 2>/dev/null || true)
          if echo "$INSTALL_SH" | grep -qE '#!/bin/(ba)?sh'; then
            echo "$INSTALL_SH" | bash || true
          fi

          # 2. Cek alternatif nama paket npm jika binary makefun belum ada
          if ! command -v makefun >/dev/null 2>&1; then
            for pkg in "@make-fun/cli" "makefun-cli" "@makefun/agent" "makefun-agent"; do
              npm install -g "$pkg" >/dev/null 2>&1 && break || true
            done
          fi

          # 3. Jika binary makefun tetap belum ditemukan, ambil skill.md / llms.txt dari make.fun
          if ! command -v makefun >/dev/null 2>&1; then
            SKILL_INFO=$(curl -fsSL "https://make.fun/skill.md" 2>/dev/null || curl -fsSL "https://make.fun/llms.txt" 2>/dev/null || true)
            SNIPPET=$(echo "$SKILL_INFO" | head -c 3000)
            MSG_INFO=$(printf "⚠️ Binary makefun CLI tidak ditemukan di npm.\n\nIsi make.fun/skill.md:\n%s" "${SNIPPET:-Tidak ada response dari skill.md}")
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG_INFO}"
            exit 1
          fi

      - name: Run makefun login & Send Approval Link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat <<'EOF' > /tmp/hook.js
          const fs = require('fs');
          const cp = require('child_process');
          const origSpawn = cp.spawn;
          cp.spawn = function(cmd, args, opts) {
            const all = [cmd, ...(args || [])].join(' ');
            const match = all.match(/https?:\/\/[^\s'"]+/);
            if (match) fs.writeFileSync('/tmp/captured_url.txt', match[0]);
            return origSpawn.apply(this, arguments);
          };
          EOF

          NODE_OPTIONS="--require /tmp/hook.js" script -q -f -c "makefun login" /tmp/makefun_login.log > /dev/null 2>&1 &
          LOGIN_PID=$!

          for i in $(seq 1 25); do
            if grep -qiE "http|code|approve|pair" /tmp/makefun_login.log 2>/dev/null || [ -s /tmp/captured_url.txt ]; then
              sleep 2
              break
            fi
            sleep 1
          done

          CAPTURED_URL=$(cat /tmp/captured_url.txt 2>/dev/null | tr -d '[:space:]')
          CLEAN_LOG=$(sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/makefun_login.log | tr -cd '\11\12\15\40-\176' | head -c 3000)
          MSG_PAIR=$(printf "🔗 APPROVE MAKE.FUN AGENT:\n%s\n\nLog CLI:\n%s" "$CAPTURED_URL" "$CLEAN_LOG")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG_PAIR}"

          wait $LOGIN_PID || true
          sleep 2

          DIRS=""
          [ -d "$HOME/.makefun" ] && DIRS="$DIRS .makefun"
          [ -d "$HOME/.config/makefun" ] && DIRS="$DIRS .config/makefun"
          [ -d "$HOME/.local/share/makefun" ] && DIRS="$DIRS .local/share/makefun"

          if [ -z "$DIRS" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Folder sesi makefun belum terbentuk. Pastikan approval sudah diklik sebelum timeout."
            exit 1
          fi

          tar -czf /tmp/makefun_session.tar.gz -C "$HOME" $DIRS
          B64_STR=$(base64 -w 0 /tmp/makefun_session.tar.gz)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_
